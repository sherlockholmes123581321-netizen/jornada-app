<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#020617"/>
  <title>Jornada</title>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
    body{margin:0;background:#020617;overscroll-behavior:none;}
    input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:0.4;}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback}=React;
const MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYSFULL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DEFAULT_SETTINGS={dailyRate:56.70,overtimeRate:16.00,kmRate:0.27,spainNightRate:30.00,abroadNightRate:40.00,irpfPercent:0,workdayHours:8,startDate:'2026-04-06'};
const todayStr=()=>new Date().toISOString().split('T')[0];
function getPayPeriod(s){const[y,m,d]=s.split('-').map(Number),mi=m-1;if(d>=29)return{sy:y,sm:mi,ey:mi===11?y+1:y,em:mi===11?0:mi+1};return{sy:mi===0?y-1:y,sm:mi===0?11:mi-1,ey:y,em:mi};}
const periodKey=p=>`${p.sy}-${String(p.sm).padStart(2,'0')}`;
const periodLabel=p=>`29 ${MS[p.sm]} ${p.sy} – 28 ${MS[p.em]} ${p.ey}`;
const currentPeriod=()=>getPayPeriod(todayStr());
const isCurrent=p=>periodKey(p)===periodKey(currentPeriod());
function prevPeriod(p){const sm=p.sm===0?11:p.sm-1,sy=p.sm===0?p.sy-1:p.sy;return{sy,sm,ey:p.sy,em:p.sm};}
function nextPeriod(p){const sm=p.em,sy=p.ey,em=sm===11?0:sm+1,ey=sm===11?sy+1:sy;return{sy,sm,ey,em};}
function isPast(p){const cp=currentPeriod();return periodKey(p)<periodKey(cp);}
function isFuture(p){const cp=currentPeriod();return periodKey(p)>periodKey(cp);}
function getDow(ds){const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay();}
function isWeekend(ds){const dow=getDow(ds);return dow===0||dow===6;}
function fmtDate(ds){const[y,m,d]=ds.split('-').map(Number);return`${DAYS[new Date(y,m-1,d).getDay()]} ${d} ${MS[m-1]}`;}
const fmt=n=>(n===null||n===undefined||isNaN(n))?'–':n.toFixed(2).replace('.',',')+' €';
function calcDayExtras(e,s){const km=(e.km||0)*s.kmRate,sn=e.spainNight?s.spainNightRate:0,an=e.abroadNight?s.abroadNightRate:0,hot=e.hotel||0,mel=e.meals||0,grat=e.gratification||0;return{km,sn,an,hot,mel,grat,total:km+sn+an+hot+mel+grat};}
function calcPeriodStats(entries,s,period){
  const cur=isCurrent(period);
  let start=new Date(period.sy,period.sm,29);
  if(s.startDate){const sd=new Date(s.startDate+'T12:00:00');if(sd>start)start=sd;}
  const fullEnd=new Date(period.ey,period.em,28,23,59,59);
  const today=new Date();today.setHours(23,59,59,0);
  const end=cur&&today<fullEnd?today:fullEnd;
  const totalDays=Math.round((fullEnd-start)/86400000)+1;
  const currentDays=Math.round((end-start)/86400000)+1;
  const entryMap={};entries.forEach(e=>entryMap[e.date]=e);
  let base=0,weekendPay=0,otPay=0,autoDays=0,regWeekdays=0,regWeekends=0,otHours=0,weekendHours=0;
  let kmPay=0,kmTotal=0,snPay=0,snCount=0,anPay=0,anCount=0,hotelTotal=0,mealsTotal=0,gratTotal=0;
  const d=new Date(start);
  while(d<=end){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dow=d.getDay(),wknd=dow===0||dow===6;
    const entry=entryMap[ds];
    if(!entry){base+=s.dailyRate;autoDays++;}
    else{
      const h=entry.hoursWorked||0;
      if(wknd){weekendPay+=h*s.overtimeRate;weekendHours+=h;regWeekends++;}
      else{base+=s.dailyRate;regWeekdays++;const otH=Math.max(0,h-s.workdayHours);otPay+=otH*s.overtimeRate;otHours+=otH;}
      const ex=calcDayExtras(entry,s);
      kmPay+=ex.km;kmTotal+=entry.km||0;
      if(entry.spainNight){snPay+=s.spainNightRate;snCount++;}
      if(entry.abroadNight){anPay+=s.abroadNightRate;anCount++;}
      hotelTotal+=entry.hotel||0;mealsTotal+=entry.meals||0;gratTotal+=entry.gratification||0;
    }
    d.setDate(d.getDate()+1);
  }
  const extrasTotal=kmPay+snPay+anPay+hotelTotal+mealsTotal+gratTotal;
  const net=base+weekendPay+otPay+extrasTotal;
  const gross=s.irpfPercent>0?net/(1-s.irpfPercent/100):null;
  return{totalDays,currentDays,autoDays,regWeekdays,regWeekends,base,weekendPay,otPay,extrasTotal,net,gross,otHours,weekendHours,kmTotal,kmPay,snCount,snPay,anCount,anPay,hotelTotal,mealsTotal,gratTotal};
}
const PC={blue:'bg-blue-900/40 text-blue-300 border-blue-700/40',amber:'bg-amber-900/40 text-amber-300 border-amber-700/40',green:'bg-green-900/40 text-green-300 border-green-700/40',purple:'bg-purple-900/40 text-purple-300 border-purple-700/40',rose:'bg-rose-900/40 text-rose-300 border-rose-700/40',teal:'bg-teal-900/40 text-teal-300 border-teal-700/40',orange:'bg-orange-900/40 text-orange-300 border-orange-700/40'};
const Pill=({children,color='blue'})=><span className={`text-xs px-2 py-0.5 rounded-full border ${PC[color]||PC.blue}`}>{children}</span>;
function Toggle({label,sub,checked,onChange}){return(<div className="flex items-center justify-between py-2.5"><div><div className="text-sm text-slate-200">{label}</div>{sub&&<div className="text-xs text-slate-500 mt-0.5">{sub}</div>}</div><button onClick={()=>onChange(!checked)} className={`w-11 h-6 rounded-full transition-all relative flex-shrink-0 ml-3 ${checked?'bg-blue-600':'bg-slate-700'}`}><div className={`absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform ${checked?'translate-x-6':'translate-x-1'}`}/></button></div>);}
function NumField({label,sub,value,onChange,step='0.01',placeholder='0'}){return(<div>{label&&<label className="text-xs text-slate-400 block mb-1.5">{label}{sub&&<span className="text-slate-600 ml-1">· {sub}</span>}</label>}<input type="number" inputMode="decimal" step={step} min="0" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="w-full bg-slate-800/80 border border-slate-700/60 rounded-xl px-3 py-2.5 text-white text-base focus:border-blue-500 focus:outline-none transition-colors"/></div>);}
const Card=({children,className=''})=><div className={`bg-slate-900 rounded-2xl p-4 ${className}`}>{children}</div>;
const SecTitle=({children})=><div className="text-[11px] text-slate-500 uppercase tracking-widest mb-2 px-1 mt-5 font-medium">{children}</div>;
function MiniBar({value,max,color}){const pct=max>0?Math.min((value/max)*100,100):0;return(<div className="h-1.5 bg-slate-800 rounded-full overflow-hidden"><div style={{width:`${pct}%`,transition:'width 0.6s ease'}} className={`h-full rounded-full ${color}`}/></div>);}
function DonutChart({base,otPay,weekendPay,extras,days,totalDays}){
  const r=54,cx=70,cy=70,sw=14,circ=2*Math.PI*r,gap=5;
  const total=base+otPay+weekendPay+extras;
  const segs=[{val:base,color:'#3b82f6'},{val:otPay,color:'#f59e0b'},{val:weekendPay,color:'#f97316'},{val:extras,color:'#14b8a6'}].filter(s=>s.val>0);
  let off=0;
  const arcs=segs.map(seg=>{const pct=total>0?seg.val/total:0;const a={...seg,dashArr:`${Math.max(0,pct*circ-gap)} ${circ}`,dashOff:-(off*circ)+gap/2};off+=pct;return a;});
  return(<div className="flex flex-col items-center"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx={cx} cy={cy} r={r} fill="none" stroke="#1e293b" strokeWidth={sw}/>{arcs.map((a,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={a.color} strokeWidth={sw} strokeDasharray={a.dashArr} strokeDashoffset={a.dashOff} strokeLinecap="round" style={{transform:'rotate(-90deg)',transformOrigin:'50% 50%'}}/>)}<text x={cx} y={cy-10} textAnchor="middle" fill="white" fontSize="15" fontWeight="700">{total>0?`${Math.round(total)}€`:'–'}</text><text x={cx} y={cy+7} textAnchor="middle" fill="#64748b" fontSize="10">estimado</text><text x={cx} y={cy+21} textAnchor="middle" fill="#94a3b8" fontSize="11" fontWeight="600">{days} días</text></svg><div className="flex gap-3 text-xs flex-wrap justify-center"><div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-blue-500"/><span className="text-slate-400">Base</span></div>{otPay>0&&<div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-amber-400"/><span className="text-slate-400">Extra</span></div>}{weekendPay>0&&<div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-orange-400"/><span className="text-slate-400">Finde</span></div>}{extras>0&&<div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-teal-400"/><span className="text-slate-400">Extras</span></div>}</div></div>);
}
function EntryForm({onSave,onCancel,settings,editing}){
  const init=editing||{};
  const[date,setDate]=useState(init.date||todayStr());
  const[hours,setHours]=useState(init.hoursWorked??settings.workdayHours);
  const[km,setKm]=useState(init.km??0);
  const[sn,setSN]=useState(init.spainNight??false);
  const[an,setAN]=useState(init.abroadNight??false);
  const[hotel,setHotel]=useState(init.hotel||'');
  const[meals,setMeals]=useState(init.meals||'');
  const[grat,setGrat]=useState(init.gratification||'');
  const[gratNote,setGN]=useState(init.gratificationNote||'');
  const[location,setLoc]=useState(init.location||'');
  const[notes,setNotes]=useState(init.notes||'');
  const wknd=isWeekend(date),dow=getDow(date),h=parseFloat(hours)||0;
  const otH=!wknd?Math.max(0,h-settings.workdayHours):0;
  const dayPay=wknd?h*settings.overtimeRate:settings.dailyRate+otH*settings.overtimeRate;
  const ex=calcDayExtras({km:parseFloat(km)||0,spainNight:sn,abroadNight:an,hotel:parseFloat(hotel)||0,meals:parseFloat(meals)||0,gratification:parseFloat(grat)||0},settings);
  const handleSave=()=>onSave({id:init.id||`${date}-${Date.now()}`,date,hoursWorked:parseFloat(hours)||0,km:parseFloat(km)||0,spainNight:sn,abroadNight:an,hotel:parseFloat(hotel)||0,meals:parseFloat(meals)||0,gratification:parseFloat(grat)||0,gratificationNote:gratNote,location,notes});
  return(<div className="p-4 pb-8">
    <div className="flex items-center gap-3 mb-3"><button onClick={onCancel} className="text-slate-400 p-1 -ml-1"><svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg></button><h1 className="text-xl font-bold">{editing?'Editar jornada':'Registrar jornada'}</h1></div>
    <SecTitle>Fecha</SecTitle>
    <Card><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full bg-transparent text-white text-base focus:outline-none"/>{date&&<div className={`text-xs mt-2 font-medium ${wknd?'text-orange-400':'text-slate-500'}`}>{DAYSFULL[dow]}{wknd?' · Fin de semana — todas las horas cuentan como extra':' · Día laborable'}</div>}</Card>
    <SecTitle>Horas trabajadas</SecTitle>
    <Card><NumField label="Horas trabajadas" sub={wknd?`${fmt(settings.overtimeRate)}/h`:`8h base + extra × ${fmt(settings.overtimeRate)}/h`} value={hours} onChange={setHours} step="0.5"/>{h>0&&<div className="mt-3 pt-3 border-t border-slate-800/60 text-xs space-y-1">{wknd?<div className="flex justify-between text-orange-300"><span>{h}h × {fmt(settings.overtimeRate)}</span><span className="font-semibold">{fmt(h*settings.overtimeRate)}</span></div>:<><div className="flex justify-between text-blue-300"><span>Base jornada</span><span className="font-semibold">{fmt(settings.dailyRate)}</span></div>{otH>0&&<div className="flex justify-between text-amber-300"><span>{otH}h extra × {fmt(settings.overtimeRate)}</span><span className="font-semibold">{fmt(otH*settings.overtimeRate)}</span></div>}</>}</div>}</Card>
    <SecTitle>Lugar de trabajo</SecTitle>
    <Card><input placeholder="Obra, empresa, ciudad..." value={location} onChange={e=>setLoc(e.target.value)} className="w-full bg-transparent text-white text-base focus:outline-none placeholder-slate-600"/></Card>
    <SecTitle>Kilómetros</SecTitle>
    <Card><NumField label="Desplazamiento en obra/trabajo" sub={`${settings.kmRate.toFixed(2).replace('.',',')} €/km`} value={km} onChange={setKm}/></Card>
    <SecTitle>Dieta de viaje</SecTitle>
    <Card className="divide-y divide-slate-800/60"><Toggle label="Noche en España" sub={fmt(settings.spainNightRate)+'/noche'} checked={sn} onChange={v=>{setSN(v);if(v)setAN(false);}}/><Toggle label="Noche en extranjero" sub={fmt(settings.abroadNightRate)+'/noche'} checked={an} onChange={v=>{setAN(v);if(v)setSN(false);}}/></Card>
    <SecTitle>Gastos reembolsables</SecTitle>
    <Card className="space-y-3"><NumField label="Hotel" sub="importe real €" value={hotel} onChange={setHotel} placeholder="0,00"/><NumField label="Comidas del día" sub="total €" value={meals} onChange={setMeals} placeholder="0,00"/></Card>
    <SecTitle>Gratificación / Plus</SecTitle>
    <Card className="space-y-3"><NumField label="Importe" sub="€" value={grat} onChange={setGrat} placeholder="0,00"/>{(parseFloat(grat)||0)>0&&<input placeholder="Concepto (obra, plus especial...)" value={gratNote} onChange={e=>setGN(e.target.value)} className="w-full bg-slate-800/80 border border-slate-700/60 rounded-xl px-3 py-2.5 text-white text-sm focus:border-blue-500 focus:outline-none"/>}</Card>
    <SecTitle>Notas</SecTitle>
    <Card><textarea placeholder="Notas adicionales..." value={notes} onChange={e=>setNotes(e.target.value)} className="w-full bg-transparent text-white text-sm resize-none focus:outline-none placeholder-slate-600" rows={2}/></Card>
    <div className="mt-5 rounded-2xl p-4 mb-4" style={{background:`linear-gradient(135deg,${wknd?'#431407,#2d1a0e':'#1e3a5f,#162d4a'})`,border:`1px solid rgba(${wknd?'249,115,22':'59,130,246'},0.3)`}}>
      <div className={`text-xs uppercase tracking-widest mb-1 font-medium ${wknd?'text-orange-400':'text-blue-400'}`}>Total este día</div>
      <div className="text-3xl font-bold text-white mb-2">{fmt(dayPay+ex.total)}</div>
      <div className="flex gap-1.5 flex-wrap">{!wknd&&h>0&&<Pill color="blue">{fmt(settings.dailyRate)} base</Pill>}{!wknd&&otH>0&&<Pill color="amber">+{fmt(otH*settings.overtimeRate)} extra</Pill>}{wknd&&h>0&&<Pill color="orange">{h}h finde × {fmt(settings.overtimeRate)}</Pill>}{ex.km>0&&<Pill color="green">+{fmt(ex.km)} km</Pill>}{(ex.sn+ex.an)>0&&<Pill color="purple">+{fmt(ex.sn+ex.an)} dieta</Pill>}{(ex.hot+ex.mel)>0&&<Pill color="rose">+{fmt(ex.hot+ex.mel)} gastos</Pill>}{ex.grat>0&&<Pill color="teal">+{fmt(ex.grat)} grat.</Pill>}</div>
    </div>
    <button onClick={handleSave} className="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 rounded-2xl py-4 font-bold text-lg transition-all">{editing?'Guardar cambios':'Guardar jornada'}</button>
  </div>);
}
function EntryCard({entry,settings,onEdit,onDelete}){
  const[conf,setConf]=useState(false);
  const wknd=isWeekend(entry.date),h=entry.hoursWorked||0;
  const otH=!wknd?Math.max(0,h-settings.workdayHours):0;
  const dayPay=wknd?h*settings.overtimeRate:settings.dailyRate+otH*settings.overtimeRate;
  const ex=calcDayExtras(entry,settings);
  return(<div className={`rounded-2xl p-3.5 mb-2 ${wknd?'bg-orange-950/30 border border-orange-900/30':'bg-slate-900'}`}>
    <div className="flex justify-between items-start gap-2">
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2"><span className="font-semibold text-slate-100 text-sm">{fmtDate(entry.date)}</span>{wknd&&<span className="text-[10px] bg-orange-900/50 text-orange-300 px-1.5 py-0.5 rounded-full border border-orange-700/40">finde</span>}</div>
        {entry.location&&<div className="text-xs text-slate-400 mt-1 font-medium">📍 {entry.location}</div>}
        <div className="flex gap-1 flex-wrap mt-1.5"><Pill color={wknd?'orange':'blue'}>{h}h</Pill>{!wknd&&otH>0&&<Pill color="amber">{otH}h extra</Pill>}{(entry.km||0)>0&&<Pill color="green">{entry.km}km</Pill>}{entry.spainNight&&<Pill color="purple">🇪🇸 noche</Pill>}{entry.abroadNight&&<Pill color="purple">✈️ extran.</Pill>}{(entry.hotel||0)>0&&<Pill color="rose">hotel</Pill>}{(entry.meals||0)>0&&<Pill color="rose">comidas</Pill>}{(entry.gratification||0)>0&&<Pill color="teal">plus</Pill>}</div>
        {entry.notes&&<div className="text-xs text-slate-500 mt-1.5 truncate">{entry.notes}</div>}
      </div>
      <div className="text-right flex-shrink-0">
        <div className={`text-base font-bold ${wknd?'text-orange-300':'text-blue-300'}`}>{fmt(dayPay+ex.total)}</div>
        {ex.total>0&&<div className="text-xs text-slate-600">+{fmt(ex.total)} extras</div>}
        <div className="flex gap-1.5 mt-1.5 justify-end"><button onClick={()=>onEdit(entry)} className="text-slate-500 text-xs px-2 py-1 rounded-lg bg-slate-800">Editar</button>{!conf?<button onClick={()=>setConf(true)} className="text-slate-500 text-xs px-2 py-1 rounded-lg bg-slate-800">Borrar</button>:<div className="flex gap-1"><button onClick={()=>{onDelete(entry.id);setConf(false);}} className="text-red-400 text-xs px-2 py-1 rounded-lg bg-red-900/30 border border-red-800/50">Sí</button><button onClick={()=>setConf(false)} className="text-slate-400 text-xs px-2 py-1 rounded-lg bg-slate-800">No</button></div>}</div>
      </div>
    </div>
  </div>);
}
function ResumenMes({entries,settings,onEdit,onDelete,onNew,viewPeriod,setViewPeriod}){
  const cp=currentPeriod();
  const period=viewPeriod||cp;
  const pe=entries.filter(e=>periodKey(getPayPeriod(e.date))===periodKey(period));
  const st=calcPeriodStats(pe,settings,period);
  const sorted=[...pe].sort((a,b)=>b.date.localeCompare(a.date));
  const progressPct=st.totalDays>0?(st.currentDays/st.totalDays)*100:0;
  const cats=[{label:'Base días laborables',value:st.base,color:'bg-blue-500',show:st.base>0},{label:'Fines de semana trabajados',value:st.weekendPay,sub:`${st.weekendHours}h`,color:'bg-orange-400',show:st.weekendPay>0},{label:'Horas extra',value:st.otPay,sub:`${st.otHours}h`,color:'bg-amber-400',show:st.otPay>0},{label:'Kilómetros',value:st.kmPay,sub:`${st.kmTotal.toFixed(0)}km`,color:'bg-green-400',show:st.kmPay>0},{label:'Dietas',value:st.snPay+st.anPay,sub:`${st.snCount+st.anCount} noches`,color:'bg-purple-400',show:(st.snCount+st.anCount)>0},{label:'Hotel',value:st.hotelTotal,color:'bg-rose-400',show:st.hotelTotal>0},{label:'Comidas',value:st.mealsTotal,color:'bg-rose-300',show:st.mealsTotal>0},{label:'Gratificaciones',value:st.gratTotal,color:'bg-teal-400',show:st.gratTotal>0}].filter(c=>c.show);
  return(<div className="p-4">
    <div className="mb-4 pt-1">
    <div className="flex justify-between items-center mb-2">
      <h1 className="text-xl font-bold">{isCurrent(period)?'Mes actual':'Mes anterior'}</h1>
      <button onClick={onNew} className="bg-blue-600 rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-1.5">
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
        Añadir
      </button>
    </div>
    <div className="flex items-center gap-2">
      <button onClick={()=>setViewPeriod(prevPeriod(period))} className="text-slate-400 hover:text-white bg-slate-800 rounded-lg p-1.5 transition-colors">
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 8H1"/><path d="M8 1L1 8l7 7"/></svg>
      </button>
      <div className="text-xs text-slate-400 flex-1 text-center font-medium">{periodLabel(period)}</div>
      <button onClick={()=>setViewPeriod(isCurrent(period)?null:nextPeriod(period))} disabled={isCurrent(period)} className={`bg-slate-800 rounded-lg p-1.5 transition-colors ${isCurrent(period)?'text-slate-700 cursor-default':'text-slate-400 hover:text-white'}`}>
        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M1 8h14"/><path d="M8 1l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
    <div className="rounded-2xl p-5 mb-4" style={{background:'linear-gradient(145deg,#0f172a,#1a2744)',border:'1px solid rgba(59,130,246,0.25)'}}>
      <div className="flex items-start justify-between gap-4">
        <div className="flex-1">
          <div className="text-xs text-slate-500 uppercase tracking-widest mb-1">Total estimado</div>
          <div className="text-4xl font-bold text-white mb-1">{fmt(st.net)}</div>
          {st.gross&&<div className="text-xs text-slate-500 mb-3">Bruto ≈ {fmt(st.gross)}</div>}
          <div className="space-y-2">
            <div><div className="flex justify-between text-xs mb-1"><span className="text-blue-400">Base · {st.regWeekdays+st.autoDays} días</span><span className="text-blue-300 font-medium">{fmt(st.base)}</span></div><MiniBar value={st.base} max={st.net} color="bg-blue-500"/></div>
            {st.weekendPay>0&&<div><div className="flex justify-between text-xs mb-1"><span className="text-orange-400">Finde · {st.weekendHours}h</span><span className="text-orange-300 font-medium">{fmt(st.weekendPay)}</span></div><MiniBar value={st.weekendPay} max={st.net} color="bg-orange-400"/></div>}
            {st.otPay>0&&<div><div className="flex justify-between text-xs mb-1"><span className="text-amber-400">H. extra · {st.otHours}h</span><span className="text-amber-300 font-medium">{fmt(st.otPay)}</span></div><MiniBar value={st.otPay} max={st.net} color="bg-amber-400"/></div>}
            {st.extrasTotal>0&&<div><div className="flex justify-between text-xs mb-1"><span className="text-teal-400">Extras km/dietas</span><span className="text-teal-300 font-medium">{fmt(st.extrasTotal)}</span></div><MiniBar value={st.extrasTotal} max={st.net} color="bg-teal-400"/></div>}
          </div>
        </div>
        <DonutChart base={st.base} otPay={st.otPay} weekendPay={st.weekendPay} extras={st.extrasTotal} days={st.currentDays} totalDays={st.totalDays}/>
      </div>
      <div className="mt-4 pt-4 border-t border-slate-800/60"><div className="flex justify-between text-xs text-slate-500 mb-1.5"><span>Progreso del período</span><span>{st.currentDays} de {st.totalDays} días · {st.regWeekdays+st.regWeekends} registradas</span></div><div className="h-2 bg-slate-800 rounded-full overflow-hidden"><div style={{width:`${progressPct}%`,transition:'width 0.8s ease'}} className="h-full bg-gradient-to-r from-blue-600 to-blue-400 rounded-full"/></div></div>
    </div>
    {cats.length>1&&<><SecTitle>Desglose</SecTitle><Card className="space-y-3">{cats.map(c=><div key={c.label}><div className="flex justify-between text-sm mb-1"><span className="text-slate-400">{c.label}{c.sub&&<span className="text-slate-600 text-xs ml-1">· {c.sub}</span>}</span><span className="text-white font-semibold">{fmt(c.value)}</span></div><MiniBar value={c.value} max={st.net} color={c.color}/></div>)}</Card></>}
    {sorted.length>0?<><SecTitle>Jornadas registradas · {sorted.length}</SecTitle>{sorted.map(e=><EntryCard key={e.id} entry={e} settings={settings} onEdit={onEdit} onDelete={onDelete}/>)}</>:<div className="mt-6 text-center py-8 rounded-2xl border border-slate-800/40 border-dashed"><div className="text-3xl mb-2">📋</div><div className="text-slate-500 text-sm">Sin jornadas registradas</div><div className="text-slate-600 text-xs mt-1">Base automática: {fmt(st.base)} ({st.autoDays} días × {fmt(settings.dailyRate)})</div></div>}
  </div>);
}
function Historial({entries,settings,onEdit,onDelete}){
  const[open,setOpen]=useState(()=>{
    // auto-open previous period if it exists
    const cp=currentPeriod();
    const prev=prevPeriod(cp);
    return periodKey(prev);
  });
  const groups={};
  entries.forEach(e=>{const p=getPayPeriod(e.date),k=periodKey(p);if(!groups[k])groups[k]={period:p,entries:[]};groups[k].entries.push(e);});
  const cp=currentPeriod(),cpk=periodKey(cp);
  if(!groups[cpk])groups[cpk]={period:cp,entries:[]};
  const sorted=Object.values(groups).sort((a,b)=>periodKey(b.period).localeCompare(periodKey(a.period)));
  const currentYear=new Date().getFullYear();
  const yearEntries=entries.filter(e=>e.date.startsWith(String(currentYear)));
  const yearPKeys=[...new Set([...yearEntries.map(e=>periodKey(getPayPeriod(e.date))),cpk])];
  let yNet=0,yBase=0,yOT=0,yWknd=0,yExtras=0,yDays=0,yHours=0;
  yearPKeys.forEach(k=>{const g=groups[k];if(!g)return;const st=calcPeriodStats(g.entries,settings,g.period);yNet+=st.net;yBase+=st.base;yOT+=st.otPay;yWknd+=st.weekendPay;yExtras+=st.extrasTotal;yDays+=isCurrent(g.period)?st.currentDays:st.totalDays;g.entries.forEach(e=>yHours+=e.hoursWorked||0);});
  const yGross=settings.irpfPercent>0?yNet/(1-settings.irpfPercent/100):null;
  return(<div className="p-4">
    <h1 className="text-xl font-bold mb-4">Historial</h1>
    {yDays>0&&<><SecTitle>Acumulado {currentYear}</SecTitle><div className="rounded-2xl p-4 mb-4" style={{background:'linear-gradient(145deg,#0f172a,#1a2744)',border:'1px solid rgba(59,130,246,0.2)'}}><div className="grid grid-cols-2 gap-3 mb-3"><div className="bg-slate-800/60 rounded-xl p-3"><div className="text-xs text-slate-500 mb-1">Neto anual</div><div className="text-xl font-bold text-blue-300">{fmt(yNet)}</div></div><div className="bg-slate-800/60 rounded-xl p-3">{yGross?<><div className="text-xs text-slate-500 mb-1">Bruto est.</div><div className="text-xl font-bold text-slate-200">{fmt(yGross)}</div></>:<><div className="text-xs text-slate-500 mb-1">Horas totales</div><div className="text-xl font-bold text-amber-300">{yHours}h</div></>}</div></div><div className="space-y-2"><div><div className="flex justify-between text-xs mb-1"><span className="text-blue-400">Base</span><span className="text-blue-300">{fmt(yBase)}</span></div><MiniBar value={yBase} max={yNet} color="bg-blue-500"/></div>{yOT>0&&<div><div className="flex justify-between text-xs mb-1"><span className="text-amber-400">Horas extra</span><span className="text-amber-300">{fmt(yOT)}</span></div><MiniBar value={yOT} max={yNet} color="bg-amber-400"/></div>}{yWknd>0&&<div><div className="flex justify-between text-xs mb-1"><span className="text-orange-400">Fines de semana</span><span className="text-orange-300">{fmt(yWknd)}</span></div><MiniBar value={yWknd} max={yNet} color="bg-orange-400"/></div>}{yExtras>0&&<div><div className="flex justify-between text-xs mb-1"><span className="text-teal-400">Extras</span><span className="text-teal-300">{fmt(yExtras)}</span></div><MiniBar value={yExtras} max={yNet} color="bg-teal-400"/></div>}</div></div></>}
    <SecTitle>Por período</SecTitle>
    {sorted.map(({period,entries:pe})=>{
      const k=periodKey(period),st=calcPeriodStats(pe,settings,period),isOpen=open===k,isCur=isCurrent(period),ud=isCur?st.currentDays:st.totalDays;
      return(<div key={k} className="mb-2">
        <button onClick={()=>setOpen(isOpen?null:k)} className="w-full bg-slate-900 rounded-2xl p-4 flex justify-between items-center text-left">
          <div className="flex-1 min-w-0 mr-3"><div className="font-semibold text-sm text-slate-100 flex items-center gap-2 flex-wrap">{periodLabel(period)}{isCur&&<span className="text-[10px] bg-blue-900/60 text-blue-300 px-1.5 py-0.5 rounded-full border border-blue-700/40">actual</span>}</div><div className="text-xs text-slate-500 mt-0.5">{ud} días · {pe.length} registradas{st.otHours>0?` · ${st.otHours}h extra`:''}</div><div className="mt-1.5 h-1 bg-slate-800 rounded-full overflow-hidden w-28 flex"><div style={{width:`${st.net>0?(st.base/st.net)*100:100}%`}} className="h-full bg-blue-600"/><div style={{width:`${st.net>0?(st.otPay/st.net)*100:0}%`}} className="h-full bg-amber-400"/><div style={{width:`${st.net>0?(st.weekendPay/st.net)*100:0}%`}} className="h-full bg-orange-400"/><div style={{width:`${st.net>0?(st.extrasTotal/st.net)*100:0}%`}} className="h-full bg-teal-400"/></div></div>
          <div className="text-right flex-shrink-0"><div className="text-base font-bold text-blue-300">{fmt(st.net)}</div><div className="text-slate-600 text-xs mt-1">{isOpen?'▲':'▼'}</div></div>
        </button>
        {isOpen&&<div className="mt-1 px-1"><div className="bg-slate-900 rounded-2xl p-4 mb-3 space-y-2 text-sm"><div className="flex justify-between items-baseline pb-2 border-b border-slate-800"><span className="text-slate-400">Total</span><span className="text-2xl font-bold text-blue-300">{fmt(st.net)}</span></div><div className="flex justify-between"><span className="text-slate-500">Base ({ud} días)</span><span className="text-blue-300">{fmt(st.base)}</span></div>{st.otPay>0&&<div className="flex justify-between"><span className="text-slate-500">H. extra ({st.otHours}h)</span><span className="text-amber-300">{fmt(st.otPay)}</span></div>}{st.weekendPay>0&&<div className="flex justify-between"><span className="text-slate-500">Finde ({st.weekendHours}h)</span><span className="text-orange-300">{fmt(st.weekendPay)}</span></div>}{st.kmPay>0&&<div className="flex justify-between"><span className="text-slate-500">Km ({st.kmTotal.toFixed(0)}km)</span><span className="text-green-300">{fmt(st.kmPay)}</span></div>}{(st.snPay+st.anPay)>0&&<div className="flex justify-between"><span className="text-slate-500">Dietas</span><span className="text-purple-300">{fmt(st.snPay+st.anPay)}</span></div>}{st.hotelTotal>0&&<div className="flex justify-between"><span className="text-slate-500">Hotel</span><span className="text-rose-300">{fmt(st.hotelTotal)}</span></div>}{st.mealsTotal>0&&<div className="flex justify-between"><span className="text-slate-500">Comidas</span><span className="text-rose-300">{fmt(st.mealsTotal)}</span></div>}{st.gratTotal>0&&<div className="flex justify-between"><span className="text-slate-500">Gratificaciones</span><span className="text-teal-300">{fmt(st.gratTotal)}</span></div>}{st.gross&&<div className="flex justify-between pt-2 border-t border-slate-800 text-xs"><span className="text-slate-600">Bruto est. (IRPF {settings.irpfPercent}%)</span><span className="text-slate-400">{fmt(st.gross)}</span></div>}</div>{[...pe].sort((a,b)=>b.date.localeCompare(a.date)).map(e=><EntryCard key={e.id} entry={e} settings={settings} onEdit={onEdit} onDelete={onDelete}/>)}</div>}
      </div>);
    })}
  </div>);
}
function Ajustes({settings,onSave}){
  const[s,setS]=useState({...settings});
  const[saved,setSaved]=useState(false);
  const set=(k,v)=>setS(p=>({...p,[k]:v}));
  const handleSave=()=>{onSave({dailyRate:parseFloat(s.dailyRate)||0,overtimeRate:parseFloat(s.overtimeRate)||0,kmRate:parseFloat(s.kmRate)||0,spainNightRate:parseFloat(s.spainNightRate)||0,abroadNightRate:parseFloat(s.abroadNightRate)||0,irpfPercent:parseFloat(s.irpfPercent)||0,workdayHours:parseFloat(s.workdayHours)||8,startDate:s.startDate||''});setSaved(true);setTimeout(()=>setSaved(false),2500);};
  return(<div className="p-4 pb-8"><div className="mb-1"><h1 className="text-xl font-bold">Ajustes</h1><p className="text-xs text-slate-500 mt-0.5">Todos los valores son netos</p></div>
    <SecTitle>Incorporación</SecTitle>
  <Card>
    <label className="text-xs text-slate-400 block mb-1.5">Fecha de inicio del contrato</label>
    <input type="date" value={s.startDate||''} onChange={e=>set('startDate',e.target.value)} className="w-full bg-transparent text-white text-base focus:outline-none border-b border-slate-700 pb-1"/>
    <p className="text-xs text-slate-600 mt-2">El primer período empieza en esta fecha en vez del día 29.</p>
  </Card>
  <SecTitle>Salario diario</SecTitle><Card className="space-y-3"><NumField label="Salario neto por día natural" sub="€" value={s.dailyRate} onChange={v=>set('dailyRate',v)}/><NumField label="Horas de jornada estándar (L-V)" sub="h" value={s.workdayHours} onChange={v=>set('workdayHours',v)} step="0.5"/></Card>
    <div className="bg-slate-800/40 rounded-xl p-3 mt-2 text-xs text-slate-500 leading-relaxed">Días no registrados: {fmt(parseFloat(s.dailyRate)||0)} automático. Finde trabajado: horas × tarifa extra (sin base). Horas extra en laborable: a partir de {s.workdayHours}h.</div>
    <SecTitle>Horas extra</SecTitle><Card><NumField label="Precio hora extra (neto)" sub="€/h" value={s.overtimeRate} onChange={v=>set('overtimeRate',v)}/></Card>
    <SecTitle>Kilómetros</SecTitle><Card><NumField label="Tarifa por kilómetro" sub="€/km" value={s.kmRate} onChange={v=>set('kmRate',v)} step="0.001"/></Card>
    <SecTitle>Dietas de viaje</SecTitle><Card className="space-y-3"><NumField label="Noche en España" sub="€/noche" value={s.spainNightRate} onChange={v=>set('spainNightRate',v)}/><NumField label="Noche en extranjero" sub="€/noche" value={s.abroadNightRate} onChange={v=>set('abroadNightRate',v)}/></Card>
    <SecTitle>IRPF</SecTitle><Card><NumField label="Retención IRPF" sub="%" value={s.irpfPercent} onChange={v=>set('irpfPercent',v)} step="0.1" placeholder="0"/><p className="text-xs text-slate-600 mt-2">Lo ves en tu nómina. Déjalo en 0 para omitir el cálculo bruto.</p></Card>
    <button onClick={handleSave} className={`w-full mt-5 rounded-2xl py-4 font-bold text-lg transition-all active:scale-95 ${saved?'bg-green-600':'bg-blue-600'}`}>{saved?'✓ Guardado':'Guardar ajustes'}</button>
  </div>);
}
function App(){
  const[tab,setTab]=useState('mes');
  const[viewPeriod,setViewPeriod]=useState(null);
  const[entries,setEntries]=useState([]);
  const[settings,setSett]=useState(DEFAULT_SETTINGS);
  const[loading,setLoading]=useState(true);
  const[editing,setEditing]=useState(null);
  useEffect(()=>{try{const se=localStorage.getItem('jornada-entries'),ss=localStorage.getItem('jornada-settings');if(se)setEntries(JSON.parse(se));if(ss)setSett(JSON.parse(ss));}catch(e){}setLoading(false);},[]);
  const saveEntries=useCallback(ne=>{setEntries(ne);try{localStorage.setItem('jornada-entries',JSON.stringify(ne));}catch(e){}});
  const saveSettings=useCallback(ns=>{setSett(ns);try{localStorage.setItem('jornada-settings',JSON.stringify(ns));}catch(e){}});
  const handleSave=entry=>{const ne=[...entries.filter(e=>e.id!==entry.id),entry].sort((a,b)=>a.date.localeCompare(b.date));saveEntries(ne);setEditing(null);setTab('mes');};
  const handleDelete=id=>saveEntries(entries.filter(e=>e.id!==id));
  const handleEdit=entry=>{setEditing(entry);setTab('nueva');};
  const handleNew=()=>{setEditing(null);setTab('nueva');};
  if(loading)return <div className="flex items-center justify-center h-screen bg-slate-950 text-slate-400 text-sm">Cargando...</div>;
  const tabs=[{id:'nueva',label:'Nueva',icon:<svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>},{id:'mes',label:'Mes',icon:<svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="4" x2="9" y2="9"/><line x1="15" y1="4" x2="15" y2="9"/></svg>},{id:'historial',label:'Historial',icon:<svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>},{id:'ajustes',label:'Ajustes',icon:<svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>}];
  return(<div className="bg-slate-950 min-h-screen text-white flex flex-col" style={{fontFamily:"-apple-system,'Segoe UI',sans-serif"}}>
    <div className="flex-1 overflow-auto pb-20 max-w-lg mx-auto w-full">
      {tab==='nueva'&&<EntryForm onSave={handleSave} onCancel={()=>{setTab('mes');setEditing(null);}} settings={settings} editing={editing}/>}
      {tab==='mes'&&<ResumenMes entries={entries} settings={settings} onEdit={handleEdit} onDelete={handleDelete} onNew={handleNew} viewPeriod={viewPeriod} setViewPeriod={setViewPeriod}/>}
      {tab==='historial'&&<Historial entries={entries} settings={settings} onEdit={handleEdit} onDelete={handleDelete}/>}
      {tab==='ajustes'&&<Ajustes settings={settings} onSave={saveSettings}/>}
    </div>
    <div className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-slate-950/95 border-t border-slate-800/80 flex" style={{paddingBottom:'env(safe-area-inset-bottom)'}}>
      {tabs.map(t=><button key={t.id} onClick={()=>{setTab(t.id);if(t.id!=='nueva')setEditing(null);}} className={`flex-1 py-3 flex flex-col items-center gap-1 transition-colors ${tab===t.id?'text-blue-400':'text-slate-600'}`}>{t.icon}<span className="text-[10px] font-medium">{t.label}</span></button>)}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
