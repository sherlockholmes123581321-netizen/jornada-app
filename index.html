function Ajustes({settings,onSave,onGetEntries,onRestoreEntries}){
  const[s,setS]=useState({...settings});
  const[saved,setSaved]=useState(false);
  const[restoreMsg,setRestoreMsg]=useState('');
  const set=(k,v)=>setS(p=>({...p,[k]:v}));
  const handleSave=()=>{onSave({dailyRate:parseFloat(s.dailyRate)||0,overtimeRate:parseFloat(s.overtimeRate)||0,kmRate:parseFloat(s.kmRate)||0,spainNightRate:parseFloat(s.spainNightRate)||0,abroadNightRate:parseFloat(s.abroadNightRate)||0,irpfPercent:parseFloat(s.irpfPercent)||0,workdayHours:parseFloat(s.workdayHours)||8,startDate:s.startDate||'',accidentePct:parseFloat(s.accidentePct)||100,workerName:s.workerName||'',reminderHour:parseFloat(s.reminderHour)||17});setSaved(true);setTimeout(()=>setSaved(false),2500);};

  const handleBackup=()=>{
    const pn=JSON.parse(localStorage.getItem('jornada-period-notes')||'{}');
    const nv=JSON.parse(localStorage.getItem('jornada-nomina-values')||'{}');
    const data={version:1,exportDate:new Date().toISOString(),settings,entries:onGetEntries(),periodNotes:pn,nominaValues:nv};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`jornada-backup-${new Date().toISOString().split('T')[0]}.json`;a.click();
    URL.revokeObjectURL(url);
  };

  const handleRestore=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.entries||!Array.isArray(data.entries))throw new Error('Formato inválido');
        if(window.confirm(`¿Restaurar ${data.entries.length} jornadas? Esto reemplazará todos los datos actuales.`)){
          onRestoreEntries(data.entries);
          if(data.settings)onSave(data.settings);
          if(data.periodNotes){try{localStorage.setItem('jornada-period-notes',JSON.stringify(data.periodNotes));}catch(e){}}
          if(data.nominaValues){try{localStorage.setItem('jornada-nomina-values',JSON.stringify(data.nominaValues));}catch(e){}}
          setRestoreMsg(`✓ Restauradas ${data.entries.length} jornadas`);
          setTimeout(()=>setRestoreMsg(''),3000);
        }
      }catch(err){setRestoreMsg('Error: archivo no válido');setTimeout(()=>setRestoreMsg(''),3000);}
    };
    reader.readAsText(file);
    e.target.value='';
  };

  return(<div className="p-4 pb-8 fade-in">
    <h1 className="text-2xl font-black tracking-tight mb-1 pt-2">Ajustes</h1>
    <p className="text-xs text-slate-500 mb-2">Todos los valores son netos</p>

    <SecTitle>Datos personales</SecTitle>
    <Card>
      <label className="text-xs text-slate-400 block mb-1.5 font-medium">Tu nombre completo</label>
      <input type="text" placeholder="Nombre Apellido Apellido" value={s.workerName||''} onChange={e=>set('workerName',e.target.value)}
        className="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-3.5 py-3 text-white text-base focus:border-blue-500/70 focus:outline-none transition-all"/>
      <p className="text-xs text-slate-600 mt-2">Aparece en el parte mensual y en los PDF exportados.</p>
    </Card>

    <SecTitle>Recordatorio diario</SecTitle>
    <Card>
      <div className="flex items-center justify-between">
        <div>
          <label className="text-sm text-slate-200 font-medium block">Hora del recordatorio</label>
          <p className="text-xs text-slate-600 mt-0.5">Si abres la app después de esta hora y llevas días sin registrar, aparece el aviso.</p>
        </div>
        <div className="flex items-center gap-2 ml-4">
          <input type="number" min="0" max="23" step="1" value={s.reminderHour??17} onChange={e=>set('reminderHour',e.target.value)}
            className="w-16 bg-slate-800/60 border border-slate-700/50 rounded-xl px-3 py-2.5 text-white text-base text-center focus:border-blue-500/70 focus:outline-none"/>
          <span className="text-slate-400 font-semibold">:00</span>
        </div>
      </div>
    </Card>

    <SecTitle>Incorporación</SecTitle>
    <Card>
      <label className="text-xs text-slate-400 block mb-1.5 font-medium">Fecha de inicio del contrato</label>
      <input type="date" value={s.startDate||''} onChange={e=>set('startDate',e.target.value)} className="w-full bg-transparent text-white text-base focus:outline-none border-b border-slate-700/50 pb-2"/>
      <p className="text-xs text-slate-600 mt-2">El primer período empieza en esta fecha en vez del día 29.</p>
    </Card>

    <SecTitle>Jornada</SecTitle>
    <Card className="space-y-3">
      <NumField label="Salario neto por día natural" sub="€" value={s.dailyRate} onChange={v=>set('dailyRate',v)} hint="Se multiplica por los días naturales del período automáticamente."/>
      <NumField label="Horas estándar laborable (L-V)" sub="h" value={s.workdayHours} onChange={v=>set('workdayHours',v)} step="0.5"/>
    </Card>

    <SecTitle>Horas extra</SecTitle>
    <Card><NumField label="Precio hora extra (neto)" sub="€/h" value={s.overtimeRate} onChange={v=>set('overtimeRate',v)}/></Card>

    <SecTitle>Accidente laboral</SecTitle>
    <Card>
      <NumField label="Porcentaje cobrado en accidente laboral" sub="%" value={s.accidentePct||100} onChange={v=>set('accidentePct',v)} step="1" placeholder="100"/>
      <p className="text-xs text-slate-600 mt-2 leading-relaxed">La ley establece el 75%, pero muchas empresas y mutuas cubren el 100%. Consulta tu convenio colectivo.</p>
    </Card>

    <SecTitle>Kilómetros</SecTitle>
    <Card><NumField label="Tarifa por kilómetro" sub="€/km" value={s.kmRate} onChange={v=>set('kmRate',v)} step="0.001"/></Card>

    <SecTitle>Dietas de viaje</SecTitle>
    <Card className="space-y-3">
      <NumField label="Noche en España" sub="€/noche" value={s.spainNightRate} onChange={v=>set('spainNightRate',v)}/>
      <NumField label="Noche en extranjero" sub="€/noche" value={s.abroadNightRate} onChange={v=>set('abroadNightRate',v)}/>
    </Card>

    <SecTitle>IRPF</SecTitle>
    <Card>
      <NumField label="Retención IRPF" sub="%" value={s.irpfPercent} onChange={v=>set('irpfPercent',v)} step="0.1" placeholder="0" hint="Lo ves en tu nómina. Déjalo en 0 para omitir el cálculo de bruto."/>
    </Card>

    <button onClick={handleSave} className={`w-full mt-6 rounded-2xl py-4 font-bold text-lg transition-all active:scale-95 ${saved?'bg-green-600':'text-white'}`}
      style={!saved?{background:'linear-gradient(135deg,#2563eb,#1d4ed8)',boxShadow:'0 4px 24px rgba(37,99,235,0.3)'}:{}}>
      {saved?'✓ Guardado':'Guardar ajustes'}
    </button>

    <SecTitle>Copia de seguridad</SecTitle>
    <Card className="space-y-3">
      <button onClick={handleBackup} className="w-full glass rounded-xl py-3 text-sm font-semibold text-slate-300 flex items-center justify-center gap-2 active:scale-95 transition-transform">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2v8M5 7l3 3 3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/></svg>
        Exportar backup completo (JSON)
      </button>
      <label className="w-full glass rounded-xl py-3 text-sm font-semibold text-slate-300 flex items-center justify-center gap-2 active:scale-95 transition-transform cursor-pointer">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M8 10V2M5 5l3-3 3 3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/></svg>
        Restaurar desde backup
        <input type="file" accept=".json" onChange={handleRestore} className="hidden"/>
      </label>
      {restoreMsg&&<div className={`text-xs text-center py-2 rounded-lg font-semibold ${restoreMsg.startsWith('✓')?'text-green-400 bg-green-500/10':'text-red-400 bg-red-500/10'}`}>{restoreMsg}</div>}
      <p className="text-xs text-slate-600 leading-relaxed">El backup incluye todas las jornadas y ajustes. Guárdalo en Google Drive o similar para no perder los datos si cambias de móvil.</p>
    </Card>
  </div>);
}

// ── APP ───────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState('mes');
  const[entries,setEntries]=useState([]);
  const[settings,setSett]=useState(DEFAULT_SETTINGS);
  const[loading,setLoading]=useState(true);
  const[editing,setEditing]=useState(null);
  const[viewPeriod,setViewPeriod]=useState(null);
  const[periodNotes,setPeriodNotes]=useState({});
  const[nominaValues,setNominaValues]=useState({});
  const[subview,setSubview]=useState('mes'); // mes|nueva|bulk

  useEffect(()=>{try{const se=localStorage.getItem('jornada-entries'),ss=localStorage.getItem('jornada-settings'),sn=localStorage.getItem('jornada-period-notes');if(se)setEntries(JSON.parse(se));if(ss)setSett(JSON.parse(ss));if(sn)setPeriodNotes(JSON.parse(sn));if(snv)setNominaValues(JSON.parse(snv));}catch(e){}setLoading(false);},[]);

  const saveEntries=useCallback(ne=>{setEntries(ne);try{localStorage.setItem('jornada-entries',JSON.stringify(ne));}catch(e){}});
  const savePeriodNotes=useCallback((pk,note)=>{const updated={...periodNotes,[pk]:note};setPeriodNotes(updated);try{localStorage.setItem('jornada-period-notes',JSON.stringify(updated));}catch(e){}});
  const saveNominaValue=useCallback((pk,val)=>{const updated={...nominaValues,[pk]:val};setNominaValues(updated);try{localStorage.setItem('jornada-nomina-values',JSON.stringify(updated));}catch(e){}});
  const getEntries=useCallback(()=>entries,[entries]);
  const restoreEntries=useCallback(ne=>{saveEntries(ne);},[saveEntries]);
  const saveSettings=useCallback(ns=>{setSett(ns);try{localStorage.setItem('jornada-settings',JSON.stringify(ns));}catch(e){}});

  const handleSave=entry=>{
    const ne=[...entries.filter(e=>e.id!==entry.id),entry].sort((a,b)=>a.date.localeCompare(b.date));
    saveEntries(ne);setEditing(null);setSubview('mes');setView('mes');
  };
  const handleBulkSave=newEntries=>{
    const existing=entries.filter(e=>!newEntries.find(n=>n.date===e.date));
    const ne=[...existing,...newEntries].sort((a,b)=>a.date.localeCompare(b.date));
    saveEntries(ne);setSubview('mes');
  };
  const handleDelete=id=>saveEntries(entries.filter(e=>e.id!==id));

  const handleEdit=entry=>{setEditing(entry);setSubview('nueva');setView('mes');};
  const handleDuplicate=entry=>{
    const nextDay=addDays(entry.date,1);
    handleEdit({...entry,id:null,date:nextDay,createdAt:null,editHistory:[],_isDuplicate:true});
  };
  const handleNew=()=>{setEditing(null);setSubview('nueva');setView('mes');};
  const handleBulk=()=>{setSubview('bulk');setView('mes');};
  const handleCancel=()=>{setEditing(null);setSubview('mes');};

  const lastDate=getLastEntryDate(entries);
  const daysSince=daysSinceLastEntry(entries);

  if(loading)return(<div className="flex items-center justify-center h-screen bg-slate-950 text-slate-400 text-sm">Cargando...</div>);

  const tabs=[
    {id:'mes',label:'Mes',icon:<svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="4" x2="9" y2="9"/><line x1="15" y1="4" x2="15" y2="9"/></svg>},
    {id:'historial',label:'Historial',icon:<svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>},
    {id:'ajustes',label:'Ajustes',icon:<svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>},
  ];

  const showNav=!(view==='mes'&&(subview==='nueva'||subview==='bulk'));

  return(<div className="bg-[#0a0f1e] text-white flex flex-col" style={{fontFamily:"-apple-system,'Segoe UI',sans-serif",height:'100%',overflow:'hidden'}}>
    <div className="flex-1 overflow-y-auto max-w-lg mx-auto w-full" style={{paddingBottom:showNav?80:16,WebkitOverflowScrolling:'touch'}}>
      {view==='mes'&&subview==='mes'&&<ResumenMes entries={entries} settings={settings} onEdit={handleEdit} onDelete={handleDelete} onNew={handleNew} onBulk={handleBulk} viewPeriod={viewPeriod} setViewPeriod={setViewPeriod} daysSince={daysSince} onDuplicate={handleDuplicate} nominaValues={nominaValues} saveNominaValue={saveNominaValue}/>}
      {view==='mes'&&subview==='nueva'&&<EntryForm onSave={handleSave} onCancel={handleCancel} settings={settings} editing={editing} lastDate={lastDate}/>}
      {view==='mes'&&subview==='bulk'&&<BulkForm onSave={handleBulkSave} onCancel={handleCancel} settings={settings} lastDate={lastDate}/>}
      {view==='historial'&&<Historial entries={entries} settings={settings} onEdit={handleEdit} onDelete={handleDelete} periodNotes={periodNotes} savePeriodNote={savePeriodNotes} onDuplicate={handleDuplicate}/>}
      {view==='ajustes'&&<Ajustes settings={settings} onSave={saveSettings} onGetEntries={getEntries} onRestoreEntries={restoreEntries}/>}
    </div>

    {showNav&&<div className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto flex px-1" style={{paddingBottom:'env(safe-area-inset-bottom)',background:'rgba(10,15,30,0.98)',backdropFilter:'blur(20px)',borderTop:'1px solid rgba(255,255,255,0.06)',zIndex:9999}}>
      {tabs.map(t=><button key={t.id} onClick={()=>{setView(t.id);if(t.id!=='mes')setSubview('mes');else setSubview('mes');}}
        className={`flex-1 py-3 flex flex-col items-center gap-1 transition-colors ${view===t.id?'text-blue-400':'text-slate-600'}`}>
        {t.icon}
        <span className="text-[10px] font-semibold tracking-wide">{t.label}</span>
      </button>)}
    </div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
