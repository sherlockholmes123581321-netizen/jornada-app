<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0f1e"/>
<title>Jornada</title>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
html{height:100%;}
body{margin:0;background:#0a0f1e;overscroll-behavior:none;position:fixed;width:100%;height:100%;height:-webkit-fill-available;overflow:hidden;}
#root{height:100%;overflow:hidden;display:flex;flex-direction:column;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:0.4;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);}
.card-gradient{background:linear-gradient(145deg,rgba(15,23,42,0.9),rgba(20,30,60,0.9));border:1px solid rgba(59,130,246,0.15);}
.shimmer{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease forwards;}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYSFULL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const CATEGORIES = [
  {id:'obra', label:'Obra', icon:'🏗️', color:'amber'},
  {id:'oficina', label:'Oficina', icon:'🏢', color:'blue'},
  {id:'desplazamiento', label:'Desplazamiento', icon:'🚗', color:'green'},
  {id:'formacion', label:'Formación', icon:'📚', color:'purple'},
  {id:'otro', label:'Otro', icon:'📌', color:'slate'},
];

const DEFAULT_SETTINGS={dailyRate:56.70,overtimeRate:16.00,kmRate:0.27,spainNightRate:30.00,abroadNightRate:40.00,irpfPercent:0,workdayHours:8,startDate:'2026-04-06',accidentePct:100,workerName:'',reminderHour:17};

// ── UTILS ─────────────────────────────────────────────────────
const todayStr=()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;};
const localDs=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function getPayPeriod(s){const[y,m,d]=s.split('-').map(Number),mi=m-1;if(d>=29)return{sy:y,sm:mi,ey:mi===11?y+1:y,em:mi===11?0:mi+1};return{sy:mi===0?y-1:y,sm:mi===0?11:mi-1,ey:y,em:mi};}
const periodKey=p=>`${p.sy}-${String(p.sm).padStart(2,'0')}`;
const periodLabel=p=>`29 ${MS[p.sm]} ${p.sy} – 28 ${MS[p.em]} ${p.ey}`;
const periodShort=p=>`${MS[p.sm]} ${p.sy}`;
const currentPeriod=()=>getPayPeriod(todayStr());
const isCurrent=p=>periodKey(p)===periodKey(currentPeriod());
function prevPeriod(p){const sm=p.sm===0?11:p.sm-1,sy=p.sm===0?p.sy-1:p.sy;return{sy,sm,ey:p.sy,em:p.sm};}
function nextPeriod(p){return{sy:p.ey,sm:p.em,ey:p.em===11?p.ey+1:p.ey,em:p.em===11?0:p.em+1};}
function getDow(ds){const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay();}
function isWeekend(ds){const dow=getDow(ds);return dow===0||dow===6;}
function fmtDate(ds){const[y,m,d]=ds.split('-').map(Number);return`${DAYS[new Date(y,m-1,d).getDay()]} ${d} ${MS[m-1]}`;}
const fmt=n=>(n===null||n===undefined||isNaN(n))?'–':n.toFixed(2).replace('.',',')+' €';
const stripAccents=s=>{let o=String(s||'');[['a','áàäâ'],['e','éèëê'],['i','íìïî'],['o','óòöô'],['u','úùüû'],['n','ñ'],['A','ÁÀÄÂ'],['E','ÉÈËÊ'],['I','ÍÌÏÎ'],['O','ÓÒÖÔ'],['U','ÚÙÜÛ'],['N','Ñ']].forEach(([k,vs])=>[...vs].forEach(v=>o=o.split(v).join(k)));return o;}
const fmtInt=n=>n===0?'–':n.toFixed(0)+' €';

function calcDayExtras(e,s){
  const km=(e.km||0)*s.kmRate,sn=e.spainNight?s.spainNightRate:0,an=e.abroadNight?s.abroadNightRate:0,hot=e.hotel||0,mel=e.meals||0,grat=e.gratification||0;
  return{km,sn,an,hot,mel,grat,total:km+sn+an+hot+mel+grat};
}

function calcPeriodStats(entries,s,period){
  const cur=isCurrent(period);
  let start=new Date(period.sy,period.sm,29);
  if(s.startDate){const sd=new Date(s.startDate+'T12:00:00');if(sd>start)start=sd;}
  const fullEnd=new Date(period.ey,period.em,28,23,59,59);
  const today=new Date();today.setHours(23,59,59,0);
  const end=cur&&today<fullEnd?today:fullEnd;
  if(end<start)return{totalDays:0,currentDays:0,autoDays:0,regWeekdays:0,regWeekends:0,base:0,weekendPay:0,otPay:0,extrasTotal:0,net:0,gross:null,otHours:0,weekendHours:0,kmTotal:0,kmPay:0,snCount:0,snPay:0,anCount:0,anPay:0,hotelTotal:0,mealsTotal:0,gratTotal:0};
  const totalDays=Math.round((fullEnd-start)/86400000)+1;
  const currentDays=Math.round((end-start)/86400000)+1;
  const entryMap={};entries.forEach(e=>entryMap[e.date]=e);
  let base=0,weekendPay=0,otPay=0,autoDays=0,regWeekdays=0,regWeekends=0,otHours=0,weekendHours=0,festivoCount=0,bajaEcCount=0,bajaEcPay=0,accidenteCount=0,accidentePay=0;
  let kmPay=0,kmTotal=0,snPay=0,snCount=0,anPay=0,anCount=0,hotelTotal=0,mealsTotal=0,gratTotal=0;
  const d=new Date(start);
  while(d<=end){
    const ds=localDs(d);
    const dow=d.getDay(),wknd=dow===0||dow===6;
    const entry=entryMap[ds];
    if(!entry){base+=s.dailyRate;autoDays++;}
    else{
      const h=entry.hoursWorked||0;
      const dt=entry.dayType||'normal';
      if(dt==='festivo'){base+=s.dailyRate;festivoCount++;}
      else if(dt==='baja_ec'){
        const bajaStart=entry.bajaStartDate||ds;
        const dayNum=Math.floor((new Date(ds+'T12:00:00')-new Date(bajaStart+'T12:00:00'))/86400000)+1;
        const pct=dayNum<=3?0:dayNum<=20?0.60:0.75;
        base+=s.dailyRate*pct;bajaEcCount++;bajaEcPay+=s.dailyRate*pct;
      }
      else if(dt==='accidente_lab'){const ap=(s.accidentePct||100)/100;base+=s.dailyRate*ap;accidenteCount++;accidentePay+=s.dailyRate*ap;}
      else if(wknd){weekendPay+=h*s.overtimeRate;weekendHours+=h;regWeekends++;}
      else{base+=s.dailyRate;regWeekdays++;const otH=Math.max(0,h-s.workdayHours);otPay+=otH*s.overtimeRate;otHours+=otH;}
      const ex=calcDayExtras(entry,s);
      kmPay+=ex.km;kmTotal+=entry.km||0;
      if(entry.spainNight){snPay+=s.spainNightRate;snCount++;}
      if(entry.abroadNight){anPay+=s.abroadNightRate;anCount++;}
      hotelTotal+=entry.hotel||0;mealsTotal+=entry.meals||0;gratTotal+=entry.gratification||0;
    }
    d.setDate(d.getDate()+1);
  }
  const extrasTotal=kmPay+snPay+anPay+hotelTotal+mealsTotal+gratTotal;
  const net=base+weekendPay+otPay+extrasTotal;
  const gross=s.irpfPercent>0?net/(1-s.irpfPercent/100):null;
  return{totalDays,currentDays,autoDays,regWeekdays,regWeekends,base,weekendPay,otPay,extrasTotal,net,gross,otHours,weekendHours,kmTotal,kmPay,snCount,snPay,anCount,anPay,hotelTotal,mealsTotal,gratTotal,festivoCount,bajaEcCount,bajaEcPay,accidenteCount,accidentePay};
}

function getLastEntryDate(entries){
  if(!entries.length)return null;
  return [...entries].sort((a,b)=>b.date.localeCompare(a.date))[0].date;
}

function addDays(ds,n){const[y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return localDs(dt);}

function daysSinceLastEntry(entries){
  const last=getLastEntryDate(entries);
  if(!last)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const lastD=new Date(last+'T12:00:00');
  return Math.floor((today-lastD)/86400000);
}

// ── CSV EXPORT ────────────────────────────────────────────────
function exportCSV(entries,settings,period){
  const pe=entries.filter(e=>periodKey(getPayPeriod(e.date))===periodKey(period));
  const DAYS_CSV=['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  const TYPES_CSV={normal:'Laboral',festivo:'Festivo',baja_ec:'Baja EC',accidente_lab:'Acc.Laboral'};
  const rows=[['Fecha','Dia','Tipo','Categoria','Horas','H.Extra','Km','Noche Espana','Noche Extranjero','Hotel','Comidas','Gratificacion','Concepto','Lugar','Notas','Total dia']];
  [...pe].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const wknd=isWeekend(e.date);
    const h=e.hoursWorked||0,otH=!wknd?Math.max(0,h-settings.workdayHours):0;
    const dayPay=wknd?h*settings.overtimeRate:settings.dailyRate+otH*settings.overtimeRate;
    const ex=calcDayExtras(e,settings);
    const cat=e.customCategory?{label:e.customCategory}:CATEGORIES.find(c=>c.id===e.category);
    const catLabel=stripAccents(cat?cat.label:'');
    const tipo=TYPES_CSV[e.dayType||'normal']||stripAccents(e.dayType||'normal');
    rows.push([e.date,DAYS_CSV[getDow(e.date)],tipo,catLabel,h,otH,e.km||0,e.spainNight?'Si':'No',e.abroadNight?'Si':'No',e.hotel||0,e.meals||0,e.gratification||0,stripAccents(e.gratificationNote||''),stripAccents(e.location||''),stripAccents(e.notes||''),(dayPay+ex.total).toFixed(2)]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([''+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`jornada-${periodKey(period)}.csv`;a.click();
  URL.revokeObjectURL(url);
}

// ── PDF EXPORT ────────────────────────────────────────────────
function exportPDF(entries, settings, period) {
  const pe = [...entries.filter(e => periodKey(getPayPeriod(e.date)) === periodKey(period))]
    .sort((a, b) => a.date.localeCompare(b.date));
  const st = calcPeriodStats(pe, settings, period);
  const isCur = isCurrent(period);
  const usedDays = isCur ? st.currentDays : st.totalDays;
  const fmtN = n => n === null || n === undefined || isNaN(n) ? '–' : n.toFixed(2).replace('.', ',') + ' €';
  const fmtD = ds => { const [y,m,d] = ds.split('-').map(Number); return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`; };
  const getDayLabel = e => {
    const dt = e.dayType || 'normal';
    if (dt === 'festivo') return 'Festivo';
    if (dt === 'accidente_lab') return 'Acc. laboral';
    if (dt === 'baja_ec') {
      const bs = e.bajaStartDate || e.date;
      const dn = Math.floor((new Date(e.date+'T12:00:00') - new Date(bs+'T12:00:00')) / 86400000) + 1;
      const pct = dn <= 3 ? 0 : dn <= 20 ? 60 : 75;
      return `Baja EC ${pct}% (día ${dn})`;
    }
    if (isWeekend(e.date)) return 'Fin de semana';
    const h = e.hoursWorked || 0;
    const otH = Math.max(0, h - settings.workdayHours);
    return otH > 0 ? `Laboral +${otH}h extra` : 'Laboral';
  };
  const getDayTotal = e => {
    const dt = e.dayType || 'normal';
    const h = e.hoursWorked || 0;
    const wknd = isWeekend(e.date);
    const accPct = (settings.accidentePct || 100) / 100;
    if (dt === 'festivo') return settings.dailyRate;
    if (dt === 'accidente_lab') return settings.dailyRate * accPct;
    if (dt === 'baja_ec') {
      const bs = e.bajaStartDate || e.date;
      const dn = Math.floor((new Date(e.date+'T12:00:00') - new Date(bs+'T12:00:00')) / 86400000) + 1;
      return settings.dailyRate * (dn <= 3 ? 0 : dn <= 20 ? 0.60 : 0.75);
    }
    const dayPay = wknd ? h * settings.overtimeRate : settings.dailyRate + Math.max(0, h - settings.workdayHours) * settings.overtimeRate;
    const ex = calcDayExtras(e, settings);
    return dayPay + ex.total;
  };

  const rows = pe.map(e => {
    const ex = calcDayExtras(e, settings);
    const total = getDayTotal(e);
    const cat = e.customCategory ? {icon:'✏️', label:e.customCategory} : CATEGORIES.find(c=>c.id===e.category);
    return `
      <tr>
        <td>${fmtD(e.date)}</td>
        <td>${DAYS[getDow(e.date)]}</td>
        <td>${getDayLabel(e)}</td>
        <td>${cat ? cat.icon+' '+cat.label : '–'}</td>
        <td>${e.hoursWorked || 0}h</td>
        <td>${(e.km || 0) > 0 ? e.km + ' km' : '–'}</td>
        <td>${e.location || '–'}</td>
        <td>${e.notes || '–'}</td>
        <td class="money">${fmtN(total)}</td>
      </tr>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Jornada – ${periodLabel(period)}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:#0f172a;background:#fff;padding:32px;font-size:13px;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid #e2e8f0;}
  .header h1{font-size:22px;font-weight:800;color:#0f172a;}
  .header .period{font-size:13px;color:#64748b;margin-top:4px;}
  .header .generated{font-size:11px;color:#94a3b8;margin-top:2px;}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;}
  .stat .label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;margin-bottom:6px;}
  .stat .value{font-size:18px;font-weight:800;color:#0f172a;}
  .stat .sub{font-size:11px;color:#64748b;margin-top:3px;}
  .stat.accent{background:#eff6ff;border-color:#bfdbfe;}
  .stat.accent .value{color:#1d4ed8;}
  .breakdown{margin-bottom:24px;}
  .breakdown h2{font-size:13px;font-weight:700;color:#374151;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.05em;}
  .breakdown-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .brow{display:flex;justify-content:space-between;background:#f8fafc;border-radius:8px;padding:10px 14px;border:1px solid #e2e8f0;}
  .brow .blabel{color:#64748b;font-weight:500;}
  .brow .bval{font-weight:700;color:#0f172a;}
  table{width:100%;border-collapse:collapse;margin-bottom:24px;}
  thead tr{background:#0f172a;color:#fff;}
  thead th{padding:10px 8px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
  tbody tr:nth-child(even){background:#f8fafc;}
  tbody tr:hover{background:#eff6ff;}
  tbody td{padding:9px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
  .money{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
  .footer{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:2px solid #e2e8f0;color:#94a3b8;font-size:11px;}
  .total-row{background:#eff6ff!important;font-weight:700;}
  .total-row td{border-top:2px solid #bfdbfe;padding:11px 8px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;}
  .badge-blue{background:#dbeafe;color:#1d4ed8;}
  .badge-amber{background:#fef3c7;color:#d97706;}
  .badge-orange{background:#ffedd5;color:#ea580c;}
  .badge-green{background:#dcfce7;color:#16a34a;}
  .badge-yellow{background:#fef9c3;color:#ca8a04;}
  .badge-red{background:#fee2e2;color:#dc2626;}
  @media print{body{padding:20px;}@page{margin:1.5cm;size:A4;}}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>Registro de Jornada Laboral</h1>
    <div class="period">${periodLabel(period)}</div>
    <div class="generated">Generado el ${new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'long',year:'numeric'})}</div>
  </div>
  <div style="text-align:right">
    <div style="font-size:28px;font-weight:800;color:#1d4ed8;">${fmtN(st.net)}</div>
    <div style="font-size:12px;color:#64748b;">Total neto estimado</div>
    ${st.gross ? `<div style="font-size:12px;color:#94a3b8;">Bruto aprox. ${fmtN(st.gross)}</div>` : ''}
  </div>
</div>

<div class="summary">
  <div class="stat accent">
    <div class="label">Base</div>
    <div class="value">${fmtN(st.base)}</div>
    <div class="sub">${usedDays} días naturales</div>
  </div>
  <div class="stat">
    <div class="label">Jornadas</div>
    <div class="value">${pe.length}</div>
    <div class="sub">${st.regWeekdays} laborables · ${st.regWeekends} fines de semana</div>
  </div>
  <div class="stat">
    <div class="label">Extras</div>
    <div class="value">${fmtN(st.extrasTotal + st.otPay + st.weekendPay)}</div>
    <div class="sub">${st.otHours > 0 ? st.otHours + 'h extra · ' : ''}${st.kmTotal > 0 ? st.kmTotal.toFixed(0) + ' km' : ''}</div>
  </div>
</div>

${(st.otPay > 0 || st.weekendPay > 0 || st.extrasTotal > 0) ? `
<div class="breakdown">
  <h2>Desglose</h2>
  <div class="breakdown-grid">
    ${st.otPay > 0 ? `<div class="brow"><span class="blabel">Horas extra (${st.otHours}h)</span><span class="bval">${fmtN(st.otPay)}</span></div>` : ''}
    ${st.weekendPay > 0 ? `<div class="brow"><span class="blabel">Fines de semana (${st.weekendHours}h)</span><span class="bval">${fmtN(st.weekendPay)}</span></div>` : ''}
    ${st.kmPay > 0 ? `<div class="brow"><span class="blabel">Kilómetros (${st.kmTotal.toFixed(0)} km)</span><span class="bval">${fmtN(st.kmPay)}</span></div>` : ''}
    ${(st.snPay + st.anPay) > 0 ? `<div class="brow"><span class="blabel">Dietas (${st.snCount + st.anCount} noches)</span><span class="bval">${fmtN(st.snPay + st.anPay)}</span></div>` : ''}
    ${st.hotelTotal > 0 ? `<div class="brow"><span class="blabel">Hotel</span><span class="bval">${fmtN(st.hotelTotal)}</span></div>` : ''}
    ${st.mealsTotal > 0 ? `<div class="brow"><span class="blabel">Comidas</span><span class="bval">${fmtN(st.mealsTotal)}</span></div>` : ''}
    ${st.gratTotal > 0 ? `<div class="brow"><span class="blabel">Gratificaciones</span><span class="bval">${fmtN(st.gratTotal)}</span></div>` : ''}
    ${st.festivoCount > 0 ? `<div class="brow"><span class="blabel">Festivos (${st.festivoCount})</span><span class="bval">${fmtN(st.festivoCount * settings.dailyRate)}</span></div>` : ''}
    ${st.bajaEcCount > 0 ? `<div class="brow"><span class="blabel">Baja EC (${st.bajaEcCount} días)</span><span class="bval">${fmtN(st.bajaEcPay)}</span></div>` : ''}
    ${st.accidenteCount > 0 ? `<div class="brow"><span class="blabel">Acc. laboral (${st.accidenteCount} días)</span><span class="bval">${fmtN(st.accidentePay)}</span></div>` : ''}
  </div>
</div>` : ''}

<table>
  <thead>
    <tr>
      <th>Fecha</th><th>Día</th><th>Tipo</th><th>Categoría</th><th>Horas</th><th>Km</th><th>Lugar</th><th>Notas</th><th>Total</th>
    </tr>
  </thead>
  <tbody>
    ${rows}
    <tr class="total-row">
      <td colspan="7"><strong>TOTAL DEL PERÍODO</strong></td>
      <td class="money">${fmtN(st.net)}</td>
    </tr>
  </tbody>
</table>

<div class="footer">
  <span>Generado con Jornada App</span>
  <span>${periodLabel(period)} · ${pe.length} jornadas registradas</span>
</div>
</body>
</html>`;

  const win = window.open('', '_blank');
  if (win) {
    win.document.write(html);
    win.document.close();
    setTimeout(() => win.print(), 800);
  }
}

// ── XLSX EXPORT ───────────────────────────────────────────────
function exportXLSX(entries, settings, period) {
  if(typeof XLSX === 'undefined') { alert('Error cargando la librería Excel. Comprueba tu conexión.'); return; }
  const pe = [...entries.filter(e => periodKey(getPayPeriod(e.date)) === periodKey(period))]
    .sort((a,b) => a.date.localeCompare(b.date));
  const st = calcPeriodStats(pe, settings, period);
  const isCur = isCurrent(period);
  const usedDays = isCur ? st.currentDays : st.totalDays;
  const DAYS_XLS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const TYPES_XLS = {normal:'Laboral',festivo:'Festivo',baja_ec:'Baja EC',accidente_lab:'Acc. Laboral'};

  // ── Sheet 1: Jornadas ──────────────────────────────────────
  const headers = ['Fecha','Día','Tipo','Categoría','Horas','H. Extra','Km','Noche España','Noche Extranjero','Hotel','Comidas','Gratificación','Concepto','Lugar','Notas','Total'];
  const dataRows = pe.map(e => {
    const wknd = isWeekend(e.date);
    const h = e.hoursWorked||0, otH = !wknd ? Math.max(0,h-settings.workdayHours) : 0;
    const dayPay = wknd ? h*settings.overtimeRate : settings.dailyRate+otH*settings.overtimeRate;
    const ex = calcDayExtras(e, settings);
    const cat = e.customCategory ? {label:e.customCategory} : CATEGORIES.find(c=>c.id===e.category);
    return [
      e.date,
      DAYS_XLS[getDow(e.date)],
      TYPES_XLS[e.dayType||'normal']||(e.dayType||''),
      cat?cat.label:'',
      h, otH,
      e.km||0,
      e.spainNight?'Sí':'No',
      e.abroadNight?'Sí':'No',
      e.hotel||0,
      e.meals||0,
      e.gratification||0,
      e.gratificationNote||'',
      e.location||'',
      e.notes||'',
      parseFloat((dayPay+ex.total).toFixed(2))
    ];
  });

  const wsData = [headers, ...dataRows];
  // Total row
  wsData.push(['TOTAL','','','','','','','','','','','','','','', parseFloat(st.net.toFixed(2))]);

  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // Column widths
  ws['!cols'] = [
    {wch:12},{wch:11},{wch:12},{wch:16},{wch:7},{wch:7},{wch:6},
    {wch:13},{wch:15},{wch:8},{wch:9},{wch:13},{wch:18},{wch:20},{wch:25},{wch:10}
  ];

  // Style header row
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let c = range.s.c; c <= range.e.c; c++) {
    const addr = XLSX.utils.encode_cell({r:0, c});
    if(!ws[addr]) continue;
    ws[addr].s = {font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1E3A5F'}},alignment:{horizontal:'center'}};
  }
  // Total row style
  const totalRow = wsData.length - 1;
  for(let c = range.s.c; c <= range.e.c; c++) {
    const addr = XLSX.utils.encode_cell({r:totalRow, c});
    if(!ws[addr]) continue;
    ws[addr].s = {font:{bold:true},fill:{fgColor:{rgb:'EFF6FF'}}};
  }

  // ── Sheet 2: Resumen ───────────────────────────────────────
  const resumenData = [
    ['RESUMEN DEL PERIODO'],
    [''],
    ['Periodo', `${periodLabel(period)}`],
    ['Dias naturales', usedDays],
    ['Jornadas registradas', pe.length],
    [''],
    ['CONCEPTO', 'CANTIDAD', 'IMPORTE'],
    ['Base salarial', `${st.regWeekdays+st.autoDays} días`, parseFloat(st.base.toFixed(2))],
  ];
  if(st.otPay>0) resumenData.push(['Horas extra', `${st.otHours}h`, parseFloat(st.otPay.toFixed(2))]);
  if(st.weekendPay>0) resumenData.push(['Fin de semana trabajado', `${st.weekendHours}h`, parseFloat(st.weekendPay.toFixed(2))]);
  if(st.kmPay>0) resumenData.push(['Kilómetros', `${st.kmTotal.toFixed(0)} km`, parseFloat(st.kmPay.toFixed(2))]);
  if((st.snPay+st.anPay)>0) resumenData.push(['Dietas', `${st.snCount+st.anCount} noches`, parseFloat((st.snPay+st.anPay).toFixed(2))]);
  if(st.hotelTotal>0) resumenData.push(['Hotel', '-', parseFloat(st.hotelTotal.toFixed(2))]);
  if(st.mealsTotal>0) resumenData.push(['Comidas', '-', parseFloat(st.mealsTotal.toFixed(2))]);
  if(st.gratTotal>0) resumenData.push(['Gratificaciones', '-', parseFloat(st.gratTotal.toFixed(2))]);
  if(st.festivoCount>0) resumenData.push(['Festivos', st.festivoCount, parseFloat((st.festivoCount*settings.dailyRate).toFixed(2))]);
  if(st.bajaEcCount>0) resumenData.push(['Baja enfermedad', `${st.bajaEcCount} días`, parseFloat(st.bajaEcPay.toFixed(2))]);
  if(st.accidenteCount>0) resumenData.push(['Accidente laboral', `${st.accidenteCount} días`, parseFloat(st.accidentePay.toFixed(2))]);
  resumenData.push(['']);
  resumenData.push(['TOTAL NETO', '', parseFloat(st.net.toFixed(2))]);
  if(st.gross) resumenData.push(['BRUTO ESTIMADO', `IRPF ${settings.irpfPercent}%`, parseFloat(st.gross.toFixed(2))]);  

  const ws2 = XLSX.utils.aoa_to_sheet(resumenData);
  ws2['!cols'] = [{wch:25},{wch:18},{wch:14}];

  // ── Workbook ───────────────────────────────────────────────
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Jornadas');
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');
  XLSX.writeFile(wb, `jornada-${periodKey(period)}.xlsx`);
}

// ── PARTE MENSUAL ─────────────────────────────────────────────
function exportParte(entries, settings, period, workerName) {
  const pe = entries.filter(e => periodKey(getPayPeriod(e.date)) === periodKey(period));
  const entryMap = {};
  pe.forEach(e => entryMap[e.date] = e);

  // Build all days in the period
  let start = new Date(period.sy, period.sm, 29);
  if(settings.startDate) { const sd = new Date(settings.startDate+'T12:00:00'); if(sd>start) start=sd; }
  const fullEnd = new Date(period.ey, period.em, 28, 23, 59, 59);
  const allDays = [];
  const d = new Date(start);
  while(d <= fullEnd) {
    allDays.push(new Date(d));
    d.setDate(d.getDate()+1);
  }

  const fmtD = ds => { const [y,m,d] = ds.split('-').map(Number); return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}`; };
  const DOWS = ['D','L','M','X','J','V','S'];
  const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // Build calendar grid - week rows
  const weeks = [];
  let week = [];
  // Pad first week
  const firstDow = allDays[0].getDay();
  const mondayFirst = firstDow === 0 ? 6 : firstDow - 1;
  for(let i = 0; i < mondayFirst; i++) week.push(null);
  allDays.forEach(day => {
    week.push(day);
    const dow = day.getDay();
    if(dow === 0) { weeks.push(week); week = []; }
  });
  if(week.length > 0) {
    while(week.length < 7) week.push(null);
    weeks.push(week);
  }

  const getDayNotes = (e) => {
    if(!e) return '';
    const parts = [];
    if((e.km||0)>0) parts.push(`${e.km}km`);
    if(e.spainNight) parts.push('Dieta ES');
    if(e.abroadNight) parts.push('Dieta EX');
    if((e.hotel||0)>0) parts.push(`Hotel ${e.hotel}€`);
    if((e.meals||0)>0) parts.push(`Comida ${e.meals}€`);
    if((e.gratification||0)>0) parts.push(`Plus ${e.gratification}€`);
    if(e.location) parts.push(e.location);
    if(e.notes) parts.push(e.notes);
    return parts.join(' · ');
  };

  const getDayType = (e, isWknd) => {
    if(!e) return '';
    const dt = e.dayType || 'normal';
    if(dt==='festivo') return 'FESTIVO';
    if(dt==='baja_ec') return 'BAJA';
    if(dt==='accidente_lab') return 'ACC.LAB';
    return '';
  };

  const totalHours = pe.reduce((a,e) => a + (e.hoursWorked||0), 0);
  const totalKm = pe.reduce((a,e) => a + (e.km||0), 0);
  const workDays = pe.filter(e => !isWeekend(e.date) && (e.dayType||'normal')==='normal').length;

  const calRows = weeks.map(week => {
    const cells = week.map(day => {
      if(!day) return `<td class="empty-cell"></td>`;
      const ds = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
      const e = entryMap[ds];
      const dow = day.getDay();
      const isWknd = dow === 0 || dow === 6;
      const h = e ? (e.hoursWorked||0) : null;
      const dayType = getDayType(e, isWknd);
      const notes = getDayNotes(e);
      const otH = e && !isWknd && h > settings.workdayHours ? h - settings.workdayHours : 0;
      const cls = isWknd ? 'weekend-cell' : e ? 'worked-cell' : 'empty-worked-cell';
      return `<td class="${cls}">
        <div class="day-header">
          <span class="day-num">${day.getDate()}</span>
          <span class="day-dow">${DOWS[dow]}</span>
        </div>
        ${dayType ? `<div class="day-type">${dayType}</div>` : ''}
        ${h !== null ? `<div class="day-hours">${h}h${otH>0?` <span class="ot">+${otH}h</span>`:''}</div>` : (isWknd ? '' : '<div class="day-hours-empty">–</div>')}
        ${notes ? `<div class="day-notes">${notes}</div>` : ''}
      </td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  const periodStr = `${String(start.getDate()).padStart(2,'0')}/${String(start.getMonth()+1).padStart(2,'0')}/${start.getFullYear()} – 28/${String(fullEnd.getMonth()+1).padStart(2,'0')}/${fullEnd.getFullYear()}`;

  const html = `<!DOCTYPE html>

  .worker-block{text-align:right;}
  .worker-block .label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;}

  .dow-header th.weekend-th{color:#94a3b8;}
  td{border:1px solid #e2e8f0;vertical-align:top;padding:6px 5px;height:72px;width:14.28%;}
  td.empty-cell{background:#f8fafc;border-color:#f1f5f9;}

function MiniBar({value,max,color,height='h-1.5'}){
  const pct=max>0?Math.min((value/max)*100,100):0;
  return(<div className={`${height} bg-slate-800/80 rounded-full overflow-hidden`}>
    <div style={{width:`${pct}%`,transition:'width 0.8s cubic-bezier(0.4,0,0.2,1)'}} className={`h-full rounded-full ${color}`}/>
  </div>);
}

function DonutChart({base,otPay,weekendPay,extras,days,totalDays}){
  const r=52,cx=68,cy=68,sw=12,circ=2*Math.PI*r,gap=4;
  const total=base+otPay+weekendPay+extras;
  const segs=[{val:base,color:'#3b82f6'},{val:otPay,color:'#f59e0b'},{val:weekendPay,color:'#f97316'},{val:extras,color:'#14b8a6'}].filter(s=>s.val>0);
  let off=0;
  const arcs=segs.map(seg=>{const pct=total>0?seg.val/total:0;const a={...seg,dashArr:`${Math.max(0,pct*circ-gap)} ${circ}`,dashOff:-(off*circ)+gap/2};off+=pct;return a;});
  const pct=totalDays>0?Math.round((days/totalDays)*100):0;
  return(<div className="flex flex-col items-center">
    <svg width="136" height="136" viewBox="0 0 136 136">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(30,41,59,0.8)" strokeWidth={sw}/>
      {arcs.map((a,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={a.color} strokeWidth={sw} strokeDasharray={a.dashArr} strokeDashoffset={a.dashOff} strokeLinecap="round" style={{transform:'rotate(-90deg)',transformOrigin:'50% 50%',transition:'all 0.8s cubic-bezier(0.4,0,0.2,1)'}}/>)}
      <text x={cx} y={cy-12} textAnchor="middle" fill="white" fontSize="16" fontWeight="700" fontFamily="-apple-system,sans-serif">{total>0?`${Math.round(total)}€`:'–'}</text>
      <text x={cx} y={cy+4} textAnchor="middle" fill="rgba(100,116,139,0.8)" fontSize="9" fontFamily="-apple-system,sans-serif">ESTIMADO</text>
      <text x={cx} y={cy+19} textAnchor="middle" fill="rgba(148,163,184,0.9)" fontSize="11" fontWeight="600" fontFamily="-apple-system,sans-serif">{days} días</text>
      <text x={cx} y={cy+33} textAnchor="middle" fill="rgba(100,116,139,0.7)" fontSize="9" fontFamily="-apple-system,sans-serif">{pct}% del mes</text>
    </svg>
    <div className="flex gap-3 text-[10px] flex-wrap justify-center mt-1">
      <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-blue-500"/><span className="text-slate-500">Base</span></div>
      {otPay>0&&<div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-amber-400"/><span className="text-slate-500">Extra</span></div>}
      {weekendPay>0&&<div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-orange-400"/><span className="text-slate-500">Finde</span></div>}
      {extras>0&&<div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-teal-400"/><span className="text-slate-500">Extras</span></div>}
    </div>
  </div>);
}

function AlertBanner({days,reminderHour}){
  if(days===null||days<=1)return null;
  const hour=new Date().getHours();
  if(hour<(reminderHour||17))return null;
  const color=days>=5?'border-red-500/30 bg-red-500/10 text-red-300':'border-amber-500/30 bg-amber-500/10 text-amber-300';
  return(<div className={`rounded-xl px-3.5 py-2.5 border ${color} flex items-center gap-2.5 mb-4 fade-in`}>
    <span className="text-lg">{days>=5?'🔴':'🟡'}</span>
    <div>
      <div className="text-xs font-semibold">{days>=5?'Llevas varios días sin registrar':'Recuerda registrar tus jornadas'}</div>
      <div className="text-[10px] opacity-70 mt-0.5">Última entrada hace {days} {days===1?'día':'días'}</div>
    </div>
  </div>);
}

// ── BAJA DAY INFO ─────────────────────────────────────────────
function BajaDayInfo({date,bajaStart,dailyRate}){
  if(!date||!bajaStart)return null;
  const dayNum=Math.floor((new Date(date+'T12:00:00')-new Date(bajaStart+'T12:00:00'))/86400000)+1;
  if(dayNum<1)return(<div className="text-xs text-red-400">⚠️ La fecha del día es anterior al inicio de la baja</div>);
  const pct=dayNum<=3?0:dayNum<=20?60:75;
  const pay=dailyRate*(pct/100);
  const label=dayNum<=3?'Sin prestación (días 1-3)':dayNum<=20?`60% — días 4-20 (día ${dayNum})`:`75% — desde día 21 (día ${dayNum})`;
  const color=dayNum<=3?'text-red-400':dayNum<=20?'text-yellow-400':'text-green-400';
  return(<div className={`flex justify-between items-center text-xs ${color} font-semibold mt-1`}>
    <span>{label}</span>
    <span>{pct>0?fmt(pay):'0,00 €'}</span>
  </div>);
}

// ── ENTRY FORM ────────────────────────────────────────────────
function EntryForm({onSave,onCancel,settings,editing,lastDate}){
  const init=editing||{};
  const defaultDate=editing?init.date:(lastDate?addDays(lastDate,1):todayStr());
  const[date,setDate]=useState(defaultDate);
  const[hours,setHours]=useState(init.hoursWorked??settings.workdayHours);
  const[km,setKm]=useState(init.km??0);
  const[sn,setSN]=useState(init.spainNight??false);
  const[an,setAN]=useState(init.abroadNight??false);
  const[hotel,setHotel]=useState(init.hotel||'');
  const[meals,setMeals]=useState(init.meals||'');
  const[grat,setGrat]=useState(init.gratification||'');
  const[gratNote,setGN]=useState(init.gratificationNote||'');
  const[location,setLoc]=useState(init.location||'');
  const[notes,setNotes]=useState(init.notes||'');

  const[dayType,setDayType]=useState(init.dayType||'normal');
  const[bajaStartDate,setBajaStart]=useState(init.bajaStartDate||'');
  const[category,setCategory]=useState(init.category||'');
  const[customCat,setCustomCat]=useState(init.customCategory||'');

  const wknd=isWeekend(date),dow=getDow(date),h=parseFloat(hours)||0;
  const otH=!wknd?Math.max(0,h-settings.workdayHours):0;
  const isAbsence=dayType==='festivo'||dayType==='baja_ec'||dayType==='accidente_lab';
  const bajaDayNum=(dayType==='baja_ec'&&bajaStartDate)?Math.floor((new Date(date+'T12:00:00')-new Date(bajaStartDate+'T12:00:00'))/86400000)+1:1;
  const bajaPct=bajaDayNum<=3?0:bajaDayNum<=20?0.60:0.75;
  const accPct=(settings.accidentePct||100)/100;const dayPay=isAbsence?(dayType==='baja_ec'?settings.dailyRate*bajaPct:dayType==='accidente_lab'?settings.dailyRate*accPct:settings.dailyRate):(wknd?h*settings.overtimeRate:settings.dailyRate+otH*settings.overtimeRate);
  const ex=isAbsence?{km:0,sn:0,an:0,hot:0,mel:0,grat:0,total:0}:calcDayExtras({km:parseFloat(km)||0,spainNight:sn,abroadNight:an,hotel:parseFloat(hotel)||0,meals:parseFloat(meals)||0,gratification:parseFloat(grat)||0},settings);
  const total=dayPay+ex.total;

  const now = new Date().toISOString();
  const handleSave=()=>{
    const isNew = !init.id;
    const editLog = isNew ? [] : [...(init.editHistory||[]), {at: now, fields: 'editado'}];
    const finalCat=showCustom&&customCat?'custom':category;const finalCatLabel=showCustom&&customCat?customCat:'';onSave({id:init.id||`${date}-${Date.now()}`,date,dayType,bajaStartDate:dayType==='baja_ec'?bajaStartDate:'',hoursWorked:isAbsence?0:parseFloat(hours)||0,km:isAbsence?0:parseFloat(km)||0,spainNight:isAbsence?false:sn,abroadNight:isAbsence?false:an,hotel:isAbsence?0:parseFloat(hotel)||0,meals:isAbsence?0:parseFloat(meals)||0,gratification:isAbsence?0:parseFloat(grat)||0,gratificationNote:isAbsence?'':gratNote,location,notes,category:finalCat,customCategory:finalCatLabel,createdAt:init.createdAt||now,editHistory:editLog});
  };

  return(<div className="p-4 pb-8 fade-in">
    <div className="flex items-center gap-3 mb-4 pt-2">
      <button onClick={onCancel} className="w-9 h-9 flex items-center justify-center rounded-xl glass text-slate-400 active:scale-95 transition-transform">
        <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 9H3"/><path d="M9 3l-6 6 6 6"/></svg>
      </button>
      <div>
        <h1 className="text-xl font-bold tracking-tight">{editing&&editing._isDuplicate?'Copiar jornada':editing?'Editar jornada':'Registrar jornada'}</h1>
        <p className="text-xs text-slate-500">El salario base cuenta automáticamente</p>
      </div>
    </div>

    <SecTitle>Fecha</SecTitle>
    <Card>
      <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full bg-transparent text-white text-base focus:outline-none font-medium"/>
      {date&&<div className={`text-xs mt-2 font-semibold flex items-center gap-1.5 ${wknd?'text-orange-400':'text-slate-500'}`}>
        <span>{wknd?'🟠':'🔵'}</span>{DAYSFULL[dow]}{wknd?' · Fin de semana — horas × 16 €':' · Día laborable'}
      </div>}
    </Card>

    <SecTitle>Tipo de día</SecTitle>
    <div className="grid grid-cols-2 gap-2 mb-1">
      {[['normal','💼','Laboral'],['festivo','🎉','Festivo'],['baja_ec','🏥','Baja enfermedad'],['accidente_lab','⚠️','Acc. laboral']].map(([val,icon,lbl])=>(
        <button key={val} onClick={()=>setDayType(val)}
          className={`rounded-xl py-2.5 px-2 text-xs font-semibold flex items-center gap-1.5 transition-all active:scale-95 ${dayType===val?'bg-blue-500/30 border border-blue-500/50 text-blue-300':'glass text-slate-400'}`}>
          <span>{icon}</span>{lbl}
        </button>
      ))}
    </div>
    {dayType==='baja_ec'&&<div className="mt-2 glass rounded-xl p-3 space-y-2">
      <label className="text-xs text-slate-400 font-medium block">Fecha de inicio de la baja</label>
      <input type="date" value={bajaStartDate} onChange={e=>setBajaStart(e.target.value)}
        className="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-3 py-2.5 text-white text-sm focus:border-blue-500/70 focus:outline-none"/>
      {bajaStartDate&&<BajaDayInfo date={date} bajaStart={bajaStartDate} dailyRate={settings.dailyRate}/>}
    </div>}
    {dayType==='accidente_lab'&&<div className="mt-2 glass rounded-xl p-3">
      <div className="flex items-center gap-2">
        <span className="text-yellow-400">⚠️</span>
        <div>
          <div className="text-xs font-bold text-yellow-300">Accidente laboral</div>
          <div className="text-xs text-slate-500">{settings.accidentePct||100}% del salario base (configurable en Ajustes)</div>
          <div className="text-xs text-blue-300 font-semibold mt-0.5">{fmt(settings.dailyRate*((settings.accidentePct||100)/100))} este día</div>
        </div>
      </div>
    </div>}

    {!isAbsence&&<React.Fragment><SecTitle>Horas trabajadas</SecTitle>
    <Card>
      <NumField sub={wknd?`× ${fmt(settings.overtimeRate)}/h`:`base 8h + extra × ${fmt(settings.overtimeRate)}/h`} value={hours} onChange={setHours} step="0.5"/>
      {h>0&&<div className="mt-3 pt-3 border-t border-slate-800/60 space-y-1.5">
        {wknd?<div className="flex justify-between text-sm"><span className="text-slate-400">{h}h × {fmt(settings.overtimeRate)}</span><span className="text-orange-300 font-bold">{fmt(h*settings.overtimeRate)}</span></div>
        :<><div className="flex justify-between text-sm"><span className="text-slate-400">Base jornada</span><span className="text-blue-300 font-bold">{fmt(settings.dailyRate)}</span></div>
        {otH>0&&<div className="flex justify-between text-sm"><span className="text-slate-400">{otH}h extra × {fmt(settings.overtimeRate)}</span><span className="text-amber-300 font-bold">{fmt(otH*settings.overtimeRate)}</span></div>}</>}
      </div>}
    </Card>

    <SecTitle>Kilómetros</SecTitle>
    <Card><NumField sub={`${settings.kmRate.toFixed(3)} €/km`} value={km} onChange={setKm}/></Card>

    <SecTitle>Dieta de viaje</SecTitle>
    <Card className="divide-y divide-slate-800/40">
      <Toggle label="Noche en España" sub={fmt(settings.spainNightRate)+'/noche'} checked={sn} onChange={v=>{setSN(v);if(v)setAN(false);}}/>
      <Toggle label="Noche en extranjero" sub={fmt(settings.abroadNightRate)+'/noche'} checked={an} onChange={v=>{setAN(v);if(v)setSN(false);}}/>
    </Card>

    <SecTitle>Gastos reembolsables</SecTitle>
    <Card className="space-y-3">
      <NumField label="Hotel" sub="importe real" value={hotel} onChange={setHotel} placeholder="0,00"/>
      <NumField label="Comidas del día" sub="total" value={meals} onChange={setMeals} placeholder="0,00"/>
    </Card>

    <SecTitle>Gratificación / Plus</SecTitle>
    <Card className="space-y-3">
      <NumField label="Importe" sub="€" value={grat} onChange={setGrat} placeholder="0,00"/>
      {(parseFloat(grat)||0)>0&&<input placeholder="Concepto (obra, plus especial...)" value={gratNote} onChange={e=>setGN(e.target.value)}
        className="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-3.5 py-3 text-white text-sm focus:border-blue-500/70 focus:outline-none"/>}
    </Card>
    </React.Fragment>}

    <SecTitle>Lugar de trabajo</SecTitle>
    <Card>
      <div className="flex items-center gap-2.5">
        <span className="text-lg">📍</span>
        <input placeholder="Obra, empresa, ciudad..." value={location} onChange={e=>setLoc(e.target.value)}
          className="flex-1 bg-transparent text-white text-base focus:outline-none placeholder-slate-600 font-medium"/>
      </div>
    </Card>

    <SecTitle>Categoría</SecTitle>
    <div className="flex gap-2 flex-wrap mb-1">
      {CATEGORIES.map(c=>(
        <button key={c.id} onClick={()=>{setCategory(category===c.id?'':c.id);setShowCustom(false);}}
          className={`rounded-xl py-2 px-3 text-xs font-semibold flex items-center gap-1.5 transition-all active:scale-95 ${!showCustom&&category===c.id?'bg-blue-500/30 border border-blue-500/50 text-blue-300':'glass text-slate-400'}`}>
          <span>{c.icon}</span>{c.label}
        </button>
      ))}
      <button onClick={()=>{setShowCustom(!showCustom);setCategory('');}}
        className={`rounded-xl py-2 px-3 text-xs font-semibold flex items-center gap-1.5 transition-all active:scale-95 ${showCustom?'bg-teal-500/30 border border-teal-500/50 text-teal-300':'glass text-slate-400'}`}>
        <span>✏️</span>Personalizada
      </button>
    </div>
    {showCustom&&<div className="glass rounded-xl px-3 py-2.5 mt-1 flex items-center gap-2">
      <span className="text-slate-500 text-sm">✏️</span>
      <input placeholder="Nombre de la categoría (ej: Reconocimiento médico)" value={customCat} onChange={e=>setCustomCat(e.target.value)}
        className="flex-1 bg-transparent text-white text-sm focus:outline-none placeholder-slate-600 font-medium"/>
    </div>}

    <SecTitle>Notas</SecTitle>
    <Card><textarea placeholder="Anotaciones para el parte..." value={notes} onChange={e=>setNotes(e.target.value)}
      className="w-full bg-transparent text-white text-sm resize-none focus:outline-none placeholder-slate-600 leading-relaxed" rows={2}/></Card>

    <div className="mt-5 rounded-2xl p-4 mb-5" style={{background:wknd?'linear-gradient(135deg,rgba(67,20,7,0.8),rgba(45,26,14,0.8))':'linear-gradient(135deg,rgba(30,58,95,0.8),rgba(22,45,74,0.8))',border:`1px solid rgba(${wknd?'249,115,22':'59,130,246'},0.25)`}}>
      <div className={`text-[10px] uppercase tracking-widest mb-2 font-bold ${wknd?'text-orange-400':'text-blue-400'}`}>Total estimado este día</div>
      <div className="text-4xl font-black text-white mb-3 tracking-tight">{fmt(total)}</div>
      <div className="flex gap-1.5 flex-wrap">
        {!wknd&&h>0&&<Pill color="blue">{fmt(settings.dailyRate)} base</Pill>}
        {!wknd&&otH>0&&<Pill color="amber">+{fmt(otH*settings.overtimeRate)} extra</Pill>}
        {wknd&&h>0&&<Pill color="orange">{h}h finde</Pill>}
        {ex.km>0&&<Pill color="green">+{fmt(ex.km)} km</Pill>}
        {(ex.sn+ex.an)>0&&<Pill color="purple">+{fmt(ex.sn+ex.an)} dieta</Pill>}
        {(ex.hot+ex.mel)>0&&<Pill color="rose">+{fmt(ex.hot+ex.mel)} gastos</Pill>}
        {ex.grat>0&&<Pill color="teal">+{fmt(ex.grat)} grat.</Pill>}
      </div>
    </div>

    <button onClick={handleSave} className="w-full rounded-2xl py-4 font-bold text-lg transition-all active:scale-95" style={{background:'linear-gradient(135deg,#2563eb,#1d4ed8)',boxShadow:'0 4px 24px rgba(37,99,235,0.3)'}}>
      {editing?'Guardar cambios':'Guardar jornada'}
    </button>
  </div>);
}

// ── BULK FORM ─────────────────────────────────────────────────
function BulkForm({onSave,onCancel,settings,lastDate}){
  const defaultFrom=lastDate?addDays(lastDate,1):todayStr();
  const[from,setFrom]=useState(defaultFrom);
  const[to,setTo]=useState(defaultFrom);
  const[hours,setHours]=useState(settings.workdayHours);
  const[skipWeekends,setSkip]=useState(true);
  const[km,setKm]=useState(0);
  const[spainNight,setSpainNight]=useState(false);
  const[abroadNight,setAbroadNight]=useState(false);
  const[hotel,setHotel]=useState('');
  const[meals,setMeals]=useState('');
  const[grat,setGrat]=useState('');
  const[gratNote,setGratNote]=useState('');
  const[bulkCat,setBulkCat]=useState('');
  const[bulkCustomCat,setBulkCustomCat]=useState('');
  const[showBulkCustom,setShowBulkCustom]=useState(false);
  const[location,setLoc]=useState('');
  const[notes,setNotes]=useState('');

  const getDays=()=>{
    const days=[];const d=new Date(from+'T12:00:00');const end=new Date(to+'T12:00:00');
    while(d<=end){const ds=localDs(d);const dow=d.getDay();if(!(skipWeekends&&(dow===0||dow===6)))days.push(ds);d.setDate(d.getDate()+1);}
    return days;
  };
  const days=getDays();

  const handleSave=()=>{
    const finalCat=showBulkCustom&&bulkCustomCat?'custom':bulkCat;
    const finalCatLabel=showBulkCustom&&bulkCustomCat?bulkCustomCat:'';
    const now=new Date().toISOString();
    const newEntries=days.map(date=>({
      id:`${date}-${Date.now()}-${Math.random()}`,date,
      hoursWorked:parseFloat(hours)||settings.workdayHours,
      km:parseFloat(km)||0,
      spainNight,abroadNight,
      hotel:parseFloat(hotel)||0,
      meals:parseFloat(meals)||0,
      gratification:parseFloat(grat)||0,
      gratificationNote:gratNote,
      category:finalCat,customCategory:finalCatLabel,
      location,notes,
      createdAt:now,editHistory:[]
    }));
    onSave(newEntries);
  };

  return(<div className="p-4 pb-8 fade-in">
    <div className="flex items-center gap-3 mb-4 pt-2">
      <button onClick={onCancel} className="w-9 h-9 flex items-center justify-center rounded-xl glass text-slate-400 active:scale-95 transition-transform">
        <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 9H3"/><path d="M9 3l-6 6 6 6"/></svg>
      </button>
      <div>
        <h1 className="text-xl font-bold tracking-tight">Registro múltiple</h1>
        <p className="text-xs text-slate-500">Registra varios días iguales de golpe</p>
      </div>
    </div>

    <SecTitle>Rango de fechas</SecTitle>
    <Card className="space-y-3">
      <div><label className="text-xs text-slate-400 block mb-1.5 font-medium">Desde</label><input type="date" value={from} onChange={e=>setFrom(e.target.value)} className="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-3.5 py-3 text-white text-base focus:border-blue-500/70 focus:outline-none"/></div>
      <div><label className="text-xs text-slate-400 block mb-1.5 font-medium">Hasta</label><input type="date" value={to} onChange={e=>setTo(e.target.value)} className="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-3.5 py-3 text-white text-base focus:border-blue-500/70 focus:outline-none"/></div>
      <Toggle label="Saltar fines de semana" sub="No registra sábados ni domingos" checked={skipWeekends} onChange={setSkip}/>
    </Card>

    {days.length>0&&<div className="mt-3 rounded-xl px-3.5 py-2.5 border border-blue-500/20 bg-blue-500/10">
      <span className="text-sm text-blue-300 font-semibold">{days.length} días</span>
      <span className="text-xs text-slate-500 ml-2">{days[0]&&fmtDate(days[0])} – {days[days.length-1]&&fmtDate(days[days.length-1])}</span>
    </div>}

    <SecTitle>Horas</SecTitle>
    <Card><NumField label="Horas por día" sub={`base ${settings.workdayHours}h + extra × ${settings.overtimeRate.toFixed(2).replace('.',',')} €/h`} value={hours} onChange={setHours} step="0.5"/></Card>

    <SecTitle>Lugar de trabajo</SecTitle>
    <Card>
      <div className="flex items-center gap-2.5">
        <span className="text-lg">📍</span>
        <input placeholder="Obra, empresa, ciudad..." value={location} onChange={e=>setLoc(e.target.value)}
          className="flex-1 bg-transparent text-white text-base focus:outline-none placeholder-slate-600 font-medium"/>
      </div>
    </Card>

    <SecTitle>Kilómetros</SecTitle>
    <Card><NumField label="Desplazamiento en obra/trabajo" sub={`${settings.kmRate.toFixed(3)} €/km`} value={km} onChange={setKm}/></Card>

    <SecTitle>Dieta de viaje</SecTitle>
    <Card className="divide-y divide-slate-800/40">
      <Toggle label="Noche en España" sub={`${settings.spainNightRate.toFixed(2).replace('.',',')} €/noche`} checked={spainNight} onChange={v=>{setSpainNight(v);if(v)setAbroadNight(false);}}/>
      <Toggle label="Noche en extranjero" sub={`${settings.abroadNightRate.toFixed(2).replace('.',',')} €/noche`} checked={abroadNight} onChange={v=>{setAbroadNight(v);if(v)setSpainNight(false);}}/>
    </Card>

    <SecTitle>Gastos reembolsables</SecTitle>
    <Card className="space-y-3">
      <NumField label="Hotel" sub="importe real €" value={hotel} onChange={setHotel} placeholder="0,00"/>
      <NumField label="Comidas del día" sub="total €" value={meals} onChange={setMeals} placeholder="0,00"/>
    </Card>

    <SecTitle>Gratificación / Plus</SecTitle>
    <Card className="space-y-3">
      <NumField label="Importe" sub="€" value={grat} onChange={setGrat} placeholder="0,00"/>
      {(parseFloat(grat)||0)>0&&<input placeholder="Concepto (obra, plus especial...)" value={gratNote} onChange={e=>setGratNote(e.target.value)}
        className="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-3 py-2.5 text-white text-sm focus:border-blue-500/70 focus:outline-none"/>}
    </Card>

    <SecTitle>Categoría</SecTitle>
    <div className="flex gap-2 flex-wrap mb-1">
      {CATEGORIES.map(c=>(
        <button key={c.id} onClick={()=>{setBulkCat(bulkCat===c.id?'':c.id);setShowBulkCustom(false);}}
          className={`rounded-xl py-2 px-3 text-xs font-semibold flex items-center gap-1.5 transition-all active:scale-95 ${!showBulkCustom&&bulkCat===c.id?'bg-blue-500/30 border border-blue-500/50 text-blue-300':'glass text-slate-400'}`}>
          <span>{c.icon}</span>{c.label}
        </button>
      ))}
      <button onClick={()=>{setShowBulkCustom(!showBulkCustom);setBulkCat('');}}
        className={`rounded-xl py-2 px-3 text-xs font-semibold flex items-center gap-1.5 transition-all active:scale-95 ${showBulkCustom?'bg-teal-500/30 border border-teal-500/50 text-teal-300':'glass text-slate-400'}`}>
        <span>✏️</span>Personalizada
      </button>
    </div>
    {showBulkCustom&&<div className="glass rounded-xl px-3 py-2.5 mt-1 flex items-center gap-2 mb-1">
      <input placeholder="Nombre de la categoría..." value={bulkCustomCat} onChange={e=>setBulkCustomCat(e.target.value)}
        className="flex-1 bg-transparent text-white text-sm focus:outline-none placeholder-slate-600 font-medium"/>
    </div>}

    <SecTitle>Notas</SecTitle>
    <Card><textarea placeholder="Notas para todas las jornadas..." value={notes} onChange={e=>setNotes(e.target.value)}
      className="w-full bg-transparent text-white text-sm resize-none focus:outline-none placeholder-slate-600" rows={2}/></Card>

    <div className="mt-5 rounded-2xl p-4 mb-5 glass">
      <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">Resumen del registro</div>
      <div className="text-3xl font-black text-white mb-1">{days.length} jornadas</div>
      <div className="text-sm text-slate-400">{fmt(days.length*settings.dailyRate)} base estimada</div>
      {(parseFloat(km)||0)>0&&<div className="text-xs text-green-400 mt-1">{fmt(days.length*(parseFloat(km)||0)*settings.kmRate)} en km</div>}
      {(spainNight||abroadNight)&&<div className="text-xs text-purple-400 mt-0.5">{fmt(days.length*(spainNight?settings.spainNightRate:settings.abroadNightRate))} en dietas</div>}
    </div>

    <button onClick={handleSave} disabled={days.length===0}
      className={`w-full rounded-2xl py-4 font-bold text-lg transition-all active:scale-95 ${days.length===0?'bg-slate-800 text-slate-600':'text-white'}`}
      style={days.length>0?{background:'linear-gradient(135deg,#2563eb,#1d4ed8)',boxShadow:'0 4px 24px rgba(37,99,235,0.3)'}:{}}>
      Registrar {days.length} jornadas
    </button>
  </div>);
}

// ── ENTRY CARD ────────────────────────────────────────────────
function EntryCard({entry,settings,onEdit,onDelete,onDuplicate}){
  const[conf,setConf]=useState(false);
  const wknd=isWeekend(entry.date),h=entry.hoursWorked||0;
  const otH=!wknd?Math.max(0,h-settings.workdayHours):0;
  const dayPay=wknd?h*settings.overtimeRate:settings.dailyRate+otH*settings.overtimeRate;
  const ex=calcDayExtras(entry,settings);
  const total=dayPay+ex.total;
  const dt=entry.dayType||'normal';
  const isAbsence=dt==='festivo'||dt==='baja_con'||dt==='baja_sin';
  const absenceColor=dt==='festivo'?'border-green-500/20 bg-green-500/5':dt==='baja_ec'?'border-yellow-500/20 bg-yellow-500/5':'border-orange-500/20 bg-orange-500/5';
  return(<div className={`rounded-2xl p-3.5 mb-2 fade-in transition-all ${isAbsence?`border ${absenceColor}`:wknd?'border border-orange-500/20 bg-orange-500/5':'glass'}`}>
    <div className="flex justify-between items-start gap-2">
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2">
          <span className="font-bold text-slate-100 text-sm">{fmtDate(entry.date)}</span>
          {wknd&&!isAbsence&&<span className="text-[10px] bg-orange-500/20 text-orange-300 px-1.5 py-0.5 rounded-full border border-orange-500/30 font-medium">finde</span>}
          {dt==='festivo'&&<span className="text-[10px] bg-green-500/20 text-green-300 px-1.5 py-0.5 rounded-full border border-green-500/30 font-medium">🎉 festivo</span>}
          {dt==='baja_ec'&&(()=>{const bs=entry.bajaStartDate||entry.date;const dn=Math.floor((new Date(entry.date+'T12:00:00')-new Date(bs+'T12:00:00'))/86400000)+1;const pct=dn<=3?0:dn<=20?60:75;return(<span className={`text-[10px] px-1.5 py-0.5 rounded-full border font-medium ${dn<=3?'bg-red-500/20 text-red-300 border-red-500/30':dn<=20?'bg-yellow-500/20 text-yellow-300 border-yellow-500/30':'bg-green-500/20 text-green-300 border-green-500/30'}`}>🏥 baja {pct}% (día {dn})</span>);})()}
          {dt==='accidente_lab'&&<span className="text-[10px] bg-orange-500/20 text-orange-300 px-1.5 py-0.5 rounded-full border border-orange-500/30 font-medium">⚠️ acc.laboral 75%</span>}
        </div>
        {entry.location&&<div className="text-xs text-slate-400 mt-1 font-medium flex items-center gap-1"><span>📍</span>{entry.location}</div>}
        <div className="flex gap-1 flex-wrap mt-1.5">
          <Pill color={wknd?'orange':'blue'}>{h}h</Pill>
          {!wknd&&otH>0&&<Pill color="amber">{otH}h extra</Pill>}
          {(entry.km||0)>0&&<Pill color="green">{entry.km}km</Pill>}
          {entry.spainNight&&<Pill color="purple">🇪🇸 noche</Pill>}
          {entry.abroadNight&&<Pill color="purple">✈️ extran.</Pill>}
          {(entry.hotel||0)>0&&<Pill color="rose">hotel</Pill>}
          {(entry.meals||0)>0&&<Pill color="rose">comidas</Pill>}
          {(entry.gratification||0)>0&&<Pill color="teal">plus</Pill>}
        </div>
        {(entry.category||entry.customCategory)&&(()=>{
          if(entry.customCategory) return <div className="text-xs mt-1.5"><span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-teal-900/40 text-teal-300 border border-teal-700/30 font-medium"><span>✏️</span>{entry.customCategory}</span></div>;
          const cat=CATEGORIES.find(c=>c.id===entry.category);
          return cat?<div className="text-xs mt-1.5"><span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-slate-800/80 text-slate-400 font-medium"><span>{cat.icon}</span>{cat.label}</span></div>:null;
        })()}
        {entry.notes&&<div className="text-xs text-slate-500 mt-1 truncate italic">{entry.notes}</div>}
        {entry.editHistory&&entry.editHistory.length>0&&<div className="text-[10px] text-slate-600 mt-1">✏️ editado {new Date(entry.editHistory[entry.editHistory.length-1].at).toLocaleDateString('es-ES')}</div>}
      </div>
      <div className="text-right flex-shrink-0">
        <div className={`text-base font-black ${wknd?'text-orange-300':'text-blue-300'}`}>{fmt(total)}</div>
        {ex.total>0&&<div className="text-[10px] text-slate-600 font-medium">+{fmt(ex.total)} extras</div>}
        <div className="flex gap-1.5 mt-2 justify-end">
          <button onClick={()=>onEdit(entry)} className="text-slate-500 text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:text-blue-400 transition-colors font-medium">Editar</button>
          <button onClick={()=>onDuplicate(entry)} className="text-slate-500 text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:text-teal-400 transition-colors font-medium">Copiar</button>
          {!conf?<button onClick={()=>setConf(true)} className="text-slate-500 text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:text-red-400 transition-colors font-medium">Borrar</button>
          :<div className="flex gap-1">
            <button onClick={()=>{onDelete(entry.id);setConf(false);}} className="text-red-400 text-xs px-2.5 py-1.5 rounded-lg bg-red-500/10 border border-red-500/30 font-medium">Sí</button>
            <button onClick={()=>setConf(false)} className="text-slate-400 text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/80 font-medium">No</button>
          </div>}
        </div>
      </div>
    </div>
  </div>);
}

// ── RESUMEN MES ───────────────────────────────────────────────
function ResumenMes({entries,settings,onEdit,onDelete,onNew,onBulk,viewPeriod,setViewPeriod,daysSince,onDuplicate,nominaValues,saveNominaValue}){
  const cp=currentPeriod();
  const period=viewPeriod||cp;
  const pk=periodKey(period);
  const pe=entries.filter(e=>periodKey(getPayPeriod(e.date))===periodKey(period));
  const st=calcPeriodStats(pe,settings,period);
  const sorted=[...pe].sort((a,b)=>b.date.localeCompare(a.date));
  const progressPct=st.totalDays>0?(st.currentDays/st.totalDays)*100:0;
  const cur=isCurrent(period);
  // nomina state managed inline
  const nominaInput=nominaValues[pk]||'';
  const setNominaInput=val=>saveNominaValue(pk,val);
  const nomina=parseFloat(nominaInput)||0;
  const nominaDiff=nomina>0?nomina-st.net:null;

  // Projection to end of month
  const daysLeft=st.totalDays-st.currentDays;
  const projected=st.net+(daysLeft*settings.dailyRate);

  // Weekly summary
  const getWeekStart=ds=>{const[y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);const dow=dt.getDay();const monday=new Date(dt);monday.setDate(dt.getDate()-(dow===0?6:dow-1));return localDs(monday);};
  const weekGroups={};
  pe.forEach(e=>{const ws=getWeekStart(e.date);if(!weekGroups[ws])weekGroups[ws]=[];weekGroups[ws].push(e);});
  // Also count auto days per week
  const weeks=Object.keys(weekGroups).sort();

  const cats=[
    {label:'Base laborables',value:st.base,color:'bg-blue-500',show:st.base>0},
    {label:'Fines de semana',value:st.weekendPay,sub:`${st.weekendHours}h`,color:'bg-orange-400',show:st.weekendPay>0},
    {label:'Horas extra',value:st.otPay,sub:`${st.otHours}h`,color:'bg-amber-400',show:st.otPay>0},
    {label:'Kilómetros',value:st.kmPay,sub:`${st.kmTotal.toFixed(0)}km`,color:'bg-green-400',show:st.kmPay>0},
    {label:'Dietas',value:st.snPay+st.anPay,sub:`${st.snCount+st.anCount} noches`,color:'bg-purple-400',show:(st.snCount+st.anCount)>0},
    {label:'Hotel',value:st.hotelTotal,color:'bg-rose-400',show:st.hotelTotal>0},
    {label:'Comidas',value:st.mealsTotal,color:'bg-rose-300',show:st.mealsTotal>0},
    {label:'Gratificaciones',value:st.gratTotal,color:'bg-teal-400',show:st.gratTotal>0},
  ].filter(c=>c.show);

  return(<div className="p-4 fade-in">
    {/* Header */}
    <div className="mb-4 pt-2">
      <div className="flex justify-between items-center mb-3">
        <h1 className="text-2xl font-black tracking-tight">{cur?'Mes actual':'Mes anterior'}</h1>
        <div className="flex gap-2">
          <button onClick={onBulk} className="glass rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 flex items-center gap-1.5 active:scale-95 transition-transform">
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><rect x="2" y="3" width="10" height="9" rx="1"/><line x1="5" y1="6" x2="9" y2="6"/><line x1="5" y1="8.5" x2="9" y2="8.5"/></svg>
            Varios
          </button>
          <button onClick={onNew} className="rounded-xl px-3 py-2 text-xs font-bold text-white flex items-center gap-1.5 active:scale-95 transition-transform" style={{background:'linear-gradient(135deg,#2563eb,#1d4ed8)'}}>
            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
            Añadir
          </button>
        </div>
      </div>
      <div className="flex items-center gap-2">
        <button onClick={()=>setViewPeriod(prevPeriod(period))} className="w-8 h-8 flex items-center justify-center glass rounded-xl text-slate-400 active:scale-95 transition-transform">
          <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 7H2"/><path d="M6 2L1 7l5 5"/></svg>
        </button>
        <div className="flex-1 text-center">
          <div className="text-xs text-slate-400 font-medium">{periodLabel(period)}</div>
        </div>
        <button onClick={()=>setViewPeriod(cur?null:nextPeriod(period))} disabled={cur}
          className={`w-8 h-8 flex items-center justify-center glass rounded-xl transition-transform ${cur?'text-slate-700 cursor-default':'text-slate-400 active:scale-95'}`}>
          <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 7h10"/><path d="M8 2l5 5-5 5"/></svg>
        </button>
      </div>
    </div>

    {cur&&<AlertBanner days={daysSince} reminderHour={settings.reminderHour}/>}

    {/* Main card */}
    <div className="rounded-3xl p-5 mb-4" style={{background:'linear-gradient(145deg,rgba(10,20,50,0.95),rgba(15,30,70,0.9))',border:'1px solid rgba(59,130,246,0.2)',boxShadow:'0 8px 32px rgba(0,0,0,0.4)'}}>
      <div className="flex items-start justify-between gap-4">
        <div className="flex-1">
          <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">Total estimado</div>
          <div className="text-5xl font-black text-white mb-1 tracking-tight leading-none">{fmt(st.net)}</div>
          {st.gross&&<div className="text-xs text-slate-500 mb-3">Bruto ≈ <span className="text-slate-400 font-semibold">{fmt(st.gross)}</span></div>}
          {!st.gross&&<div className="mb-3"/>}
          <div className="space-y-2.5">
            <div>
              <div className="flex justify-between text-xs mb-1.5">
                <span className="text-blue-400 font-semibold">Base · {st.regWeekdays+st.autoDays} días</span>
                <span className="text-blue-300 font-bold">{fmt(st.base)}</span>
              </div>
              <MiniBar value={st.base} max={st.net} color="bg-gradient-to-r from-blue-600 to-blue-400" height="h-2"/>
            </div>
            {st.weekendPay>0&&<div>
              <div className="flex justify-between text-xs mb-1.5">
                <span className="text-orange-400 font-semibold">Finde · {st.weekendHours}h</span>
                <span className="text-orange-300 font-bold">{fmt(st.weekendPay)}</span>
              </div>
              <MiniBar value={st.weekendPay} max={st.net} color="bg-gradient-to-r from-orange-500 to-orange-300" height="h-2"/>
            </div>}
            {st.otPay>0&&<div>
              <div className="flex justify-between text-xs mb-1.5">
                <span className="text-amber-400 font-semibold">H. extra · {st.otHours}h</span>
                <span className="text-amber-300 font-bold">{fmt(st.otPay)}</span>
              </div>
              <MiniBar value={st.otPay} max={st.net} color="bg-gradient-to-r from-amber-500 to-amber-300" height="h-2"/>
            </div>}
            {st.extrasTotal>0&&<div>
              <div className="flex justify-between text-xs mb-1.5">
                <span className="text-teal-400 font-semibold">Extras km/dietas</span>
                <span className="text-teal-300 font-bold">{fmt(st.extrasTotal)}</span>
              </div>
              <MiniBar value={st.extrasTotal} max={st.net} color="bg-gradient-to-r from-teal-500 to-teal-300" height="h-2"/>
            </div>}
          </div>
        </div>
        <DonutChart base={st.base} otPay={st.otPay} weekendPay={st.weekendPay} extras={st.extrasTotal} days={st.currentDays} totalDays={st.totalDays}/>
      </div>

      {/* Progress + projection */}
      <div className="mt-4 pt-4 border-t border-slate-800/60 space-y-3">
        <div>
          <div className="flex justify-between text-xs text-slate-500 mb-1.5 font-medium">
            <span>Progreso del período</span>
            <span>{st.currentDays} de {st.totalDays} días · {st.regWeekdays+st.regWeekends} registradas</span>
          </div>
          <div className="h-2 bg-slate-800/80 rounded-full overflow-hidden">
            <div style={{width:`${progressPct}%`,transition:'width 1s cubic-bezier(0.4,0,0.2,1)'}}
              className="h-full rounded-full bg-gradient-to-r from-blue-600 to-blue-400"/>
          </div>
        </div>
        {/* Days remaining */}
        {cur&&daysLeft>0&&<div className="flex justify-between items-center mb-2">
          <div className="text-xs text-slate-500 font-medium">
            <span className="text-slate-300 font-bold">{daysLeft} días</span> para fin de período
          </div>
          <div className="text-xs text-slate-600">{new Date(period.ey,period.em,28).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}</div>
        </div>}
        {cur&&daysLeft>0&&<>
          <div className="flex justify-between items-center py-1.5 border-t border-slate-800/40">
            <div className="text-xs text-slate-500">Días restantes en el período</div>
            <div className="flex items-center gap-1.5">
              <span className="text-sm font-black text-white">{daysLeft}</span>
              <span className="text-xs text-slate-500">· hasta el 28 {MS[period.em]}</span>
            </div>
          </div>
          <div className="flex justify-between items-center">
            <div>
              <div className="text-[10px] text-slate-600 uppercase tracking-wide font-bold">Proyección final del mes</div>
              <div className="text-slate-400 text-xs">Solo base, sin extras</div>
            </div>
            <div className="text-right">
              <div className="text-lg font-black text-slate-300">{fmt(projected)}</div>
            </div>
          </div>
        </>}
      </div>
    </div>

    {/* Export button */}
    <div className="grid grid-cols-2 gap-2 mb-1">
      <button onClick={()=>exportCSV(pe,settings,period)}
        className="glass rounded-xl py-2.5 text-xs font-semibold text-slate-400 flex items-center justify-center gap-1.5 active:scale-95 transition-transform">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M6.5 1v6M4 5.5l2.5 2.5L9 5.5M1 10v1a1 1 0 001 1h9a1 1 0 001-1v-1"/></svg>
        CSV
      </button>
      <button onClick={()=>exportXLSX(entries,settings,period)}
        className="glass rounded-xl py-2.5 text-xs font-semibold text-green-400 flex items-center justify-center gap-1.5 active:scale-95 transition-transform border border-green-500/20">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="1" width="11" height="11" rx="1"/><path d="M4 4l5 5M9 4l-5 5"/></svg>
        Excel
      </button>
    </div>
    <div className="grid grid-cols-2 gap-2 mb-4">
      <button onClick={()=>exportPDF(entries,settings,period)}
        className="glass rounded-xl py-2.5 text-xs font-semibold text-slate-400 flex items-center justify-center gap-1.5 active:scale-95 transition-transform">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="1" width="9" height="11" rx="1"/><path d="M4 4h5M4 6.5h5M4 9h3"/></svg>
        PDF
      </button>
      <button onClick={()=>exportParte(entries,settings,period,settings.workerName)}
        className="glass rounded-xl py-2.5 text-xs font-semibold text-blue-400 flex items-center justify-center gap-1.5 active:scale-95 transition-transform border border-blue-500/20">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="1" width="11" height="11" rx="1"/><line x1="4" y1="1" x2="4" y2="12"/><line x1="8" y1="1" x2="8" y2="12"/><line x1="1" y1="5" x2="12" y2="5"/><line x1="1" y1="9" x2="12" y2="9"/></svg>
        Parte
      </button>
    </div>

    {/* Festivos/Bajas */}
    {(st.festivoCount>0||st.bajaEcCount>0||st.accidenteCount>0)&&(
      <div className="flex gap-2 mb-4 flex-wrap">
        {st.festivoCount>0&&<div className="glass rounded-xl px-3 py-2 flex items-center gap-2"><span>🎉</span><div><div className="text-xs font-bold text-green-300">{st.festivoCount} festivo{st.festivoCount>1?'s':''}</div><div className="text-[10px] text-slate-500">{fmt(st.festivoCount*settings.dailyRate)}</div></div></div>}
        {st.bajaEcCount>0&&<div className="glass rounded-xl px-3 py-2 flex items-center gap-2"><span>🏥</span><div><div className="text-xs font-bold text-yellow-300">{st.bajaEcCount} día{st.bajaEcCount>1?'s':''} baja EC</div><div className="text-[10px] text-slate-500">{fmt(st.bajaEcPay)} cobrado</div></div></div>}
        {st.accidenteCount>0&&<div className="glass rounded-xl px-3 py-2 flex items-center gap-2"><span>⚠️</span><div><div className="text-xs font-bold text-orange-300">{st.accidenteCount} día{st.accidenteCount>1?'s':''} acc.laboral</div><div className="text-[10px] text-slate-500">{fmt(st.accidentePay)}</div></div></div>}
      </div>
    )}

    {/* Nomina comparison */}
    {(()=>{
      const [editing,setEditing]=React.useState(false);
      const [draft,setDraft]=React.useState(nominaInput);
      const saved=nomina>0;
      const handleSave=()=>{setNominaInput(draft);setEditing(false);};
      const handleEdit=()=>{setDraft(nominaInput);setEditing(true);};
      const handleClear=()=>{setNominaInput('');setDraft('');setEditing(false);};
      return(
      <div className="glass rounded-2xl p-4 mb-4">
        <div className="flex justify-between items-center mb-3">
          <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Nómina recibida</div>
          {saved&&!editing&&<button onClick={handleEdit} className="text-xs text-blue-400 font-semibold">Editar</button>}
        </div>
        {(!saved||editing)?(
          <div className="space-y-2">
            <div className="flex gap-2 items-center">
              <input type="number" inputMode="decimal" placeholder="Importe recibido €" value={editing?draft:draft}
                onChange={e=>setDraft(e.target.value)} autoFocus={editing}
                className="flex-1 bg-slate-800/60 border border-slate-700/50 rounded-xl px-3 py-2.5 text-white text-base focus:border-blue-500/70 focus:outline-none"/>
              <span className="text-slate-500 font-bold text-lg">€</span>
            </div>
            <div className="flex gap-2">
              <button onClick={handleSave} disabled={!draft}
                className={`flex-1 rounded-xl py-2.5 text-sm font-bold transition-all active:scale-95 ${draft?'bg-blue-600 text-white':'bg-slate-800 text-slate-600'}`}>
                Guardar
              </button>
              {editing&&<button onClick={handleClear} className="glass rounded-xl px-4 py-2.5 text-xs font-semibold text-red-400">Borrar</button>}
            </div>
          </div>
        ):(
          <div>
            <div className="flex justify-between items-baseline mb-3">
              <span className="text-sm text-slate-400">Importe recibido</span>
              <span className="text-2xl font-black text-white">{fmt(nomina)}</span>
            </div>
            <div className={`rounded-xl p-3 ${nominaDiff>=0?'bg-green-500/10 border border-green-500/20':'bg-red-500/10 border border-red-500/20'}`}>
              <div className="flex justify-between items-center">
                <div>
                  <div className="text-xs font-bold uppercase tracking-wide text-slate-400">Diferencia</div>
                  <div className="text-xs text-slate-500 mt-0.5">Nómina vs estimado</div>
                </div>
                <div className={`text-xl font-black ${nominaDiff>=0?'text-green-300':'text-red-300'}`}>{nominaDiff>=0?'+':''}{fmt(nominaDiff)}</div>
              </div>
              {Math.abs(nominaDiff)>5&&<div className="text-xs mt-2 text-slate-500">{nominaDiff<0?'⚠️ La nómina es menor de lo esperado.':'✓ La nómina supera el estimado.'}</div>}
            </div>
          </div>
        )}
      </div>
    );})()}

    {/* Weekly summary */}
    {weeks.length>0&&<><SecTitle>Resumen semanal</SecTitle>
    <div className="space-y-2 mb-4">
      {weeks.map(ws=>{
        const wEntries=weekGroups[ws]||[];
        const wSt=calcPeriodStats(wEntries,settings,{sy:parseInt(ws.split('-')[0]),sm:parseInt(ws.split('-')[1])-1,ey:parseInt(ws.split('-')[0]),em:parseInt(ws.split('-')[1])});
        const wEnd=addDays(ws,6);
        const wHours=wEntries.reduce((a,e)=>a+(e.hoursWorked||0),0);
        const wNet=wEntries.reduce((a,e)=>{const wknd=isWeekend(e.date),h=e.hoursWorked||0,dt=e.dayType||'normal';if(dt==='baja_sin')return a;if(dt==='festivo'||dt==='baja_con')return a+settings.dailyRate;if(wknd)return a+h*settings.overtimeRate;return a+settings.dailyRate+Math.max(0,h-settings.workdayHours)*settings.overtimeRate;},0);
        return(<div key={ws} className="glass rounded-xl p-3">
          <div className="flex justify-between items-center">
            <div>
              <div className="text-xs font-bold text-slate-300">{fmtDate(ws)} – {fmtDate(wEnd)}</div>
              <div className="text-[10px] text-slate-500 mt-0.5">{wEntries.length} jornadas · {wHours}h trabajadas</div>
            </div>
            <div className="text-sm font-black text-blue-300">{fmt(wNet)}</div>
          </div>
        </div>);
      })}
    </div></>}

    {/* Desglose */}
    {cats.length>1&&<><SecTitle>Desglose</SecTitle>
    <Card className="space-y-3.5 mb-2">
      {cats.map(c=><div key={c.label}>
        <div className="flex justify-between text-sm mb-1.5">
          <span className="text-slate-400 font-medium">{c.label}{c.sub&&<span className="text-slate-600 text-xs ml-1.5">· {c.sub}</span>}</span>

        </div>
        <MiniBar value={c.value} max={st.net} color={c.color} height="h-1.5"/>
      </div>)}
    </Card></>}

    {sorted.length>0?<>

  </div>);
}

function Historial({entries,settings,onEdit,onDelete,periodNotes,savePeriodNote,onDuplicate}){
  const[open,setOpen]=useState(null);
  const[search,setSearch]=useState('');
  const[filterCat,setFilterCat]=useState('');
  const[filterType,setFilterType]=useState('');
  // Build groups from all entries
  const groups={};
  entries.forEach(e=>{const p=getPayPeriod(e.date),k=periodKey(p);if(!groups[k])groups[k]={period:p,entries:[]};groups[k].entries.push(e);});
  const cp=currentPeriod(),cpk=periodKey(cp);
  if(!groups[cpk])groups[cpk]={period:cp,entries:[]};
  // Filter logic - defined here so it's available before return
  const filteredEntries = entries.filter(e => {
    if(search && !((e.location||'').toLowerCase().includes(search.toLowerCase()) || (e.notes||'').toLowerCase().includes(search.toLowerCase()) || fmtDate(e.date).toLowerCase().includes(search.toLowerCase()))) return false;
    if(filterCat && e.category !== filterCat) return false;
    if(filterType && (e.dayType||'normal') !== filterType) return false;
    return true;
  });
  const hasFilter = !!(search || filterCat || filterType);
  const filtGroups={};
  if(hasFilter) filteredEntries.forEach(e=>{const p=getPayPeriod(e.date),k=periodKey(p);filtGroups[k]=true;});

  const sorted=Object.values(groups)
    .filter(g=>!hasFilter||filtGroups[periodKey(g.period)])
    .sort((a,b)=>periodKey(b.period).localeCompare(periodKey(a.period)));

  const currentYear=new Date().getFullYear();
  const yearEntries=entries.filter(e=>e.date.startsWith(String(currentYear)));
  const yearPKeys=[...new Set([...yearEntries.map(e=>periodKey(getPayPeriod(e.date))),cpk])];
  let yNet=0,yBase=0,yOT=0,yWknd=0,yExtras=0,yDays=0,yHours=0;
  yearPKeys.forEach(k=>{const g=groups[k];if(!g)return;const st=calcPeriodStats(g.entries,settings,g.period);yNet+=st.net;yBase+=st.base;yOT+=st.otPay;yWknd+=st.weekendPay;yExtras+=st.extrasTotal;yDays+=isCurrent(g.period)?st.currentDays:st.totalDays;g.entries.forEach(e=>yHours+=e.hoursWorked||0);});
  const yGross=settings.irpfPercent>0?yNet/(1-settings.irpfPercent/100):null;

  // Month comparison data

      const totalKm=allYear.reduce((a,e)=>a+(e.km||0),0);

            <div className="text-base font-black text-blue-300">{fmt(st.net)}</div>
